# DMN Dropout Detection System Configuration
# Copy this file to config.yml and update with your settings

# Database Configuration (MySQL 5.7)
db_host: localhost
db_port: 3306
db_name: dmn_detection
db_user: dmn_user
db_password: your_password_here
db_pool_size: 5

# Moodle Configuration
moodle_url: https://your-moodle-site.com
moodle_token: your_moodle_webservice_token_here

# API Server Configuration
api_port: 5000
debug: false
log_level: INFO

# DMN Detection Thresholds (in seconds unless specified)
inactivity_warning_threshold_seconds: 300    # 5 minutes
inactivity_critical_threshold_seconds: 600   # 10 minutes
page_hidden_threshold_seconds: 120           # 2 minutes
page_switch_count_threshold: 5               # switches per hour
response_too_fast_ratio: 0.2                 # 20% of average
response_too_slow_ratio: 3.0                 # 300% of average
accuracy_drop_threshold: 0.5                 # 50% of historical accuracy
random_click_count_threshold: 20             # clicks in 30 seconds
repetitive_click_count_threshold: 10         # clicks in same location (1 minute)

# Engagement Score Weights
engagement_score_weights:
  active_time: 0.4
  accuracy: 0.3
  response_pattern: 0.2
  dropout_events: 0.1
