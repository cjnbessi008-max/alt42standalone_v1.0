<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlap Field - 연립부등식 교집합 시각화</title>
    <link rel="stylesheet" href="../src/styles/main.css">
    <link rel="stylesheet" href="../src/styles/smartphone.css">
</head>
<body>
    <div class="container">
        <!-- Virtual Smartphone Frame -->
        <div class="smartphone-container">
            <div class="smartphone">
                <!-- Phone hardware -->
                <div class="phone-frame">
                    <div class="phone-notch"></div>
                    <div class="phone-speaker"></div>

                    <!-- Phone screen content -->
                    <div class="phone-screen">
                        <!-- App header -->
                        <div class="app-header">
                            <h1>Overlap Field</h1>
                            <div class="problem-title" id="problemTitle">연립부등식 문제</div>
                        </div>

                        <!-- Inequalities display -->
                        <div class="inequalities-panel">
                            <h3>주어진 부등식</h3>
                            <div id="inequalitiesList" class="inequalities-list"></div>
                        </div>

                        <!-- Main visualization canvas -->
                        <div class="visualization-container">
                            <canvas id="overlapCanvas" width="800" height="800"></canvas>
                            <div class="canvas-overlay">
                                <div class="axis-labels">
                                    <span class="x-axis-label">x</span>
                                    <span class="y-axis-label">y</span>
                                </div>
                            </div>
                        </div>

                        <!-- Controls -->
                        <div class="controls-panel">
                            <div class="control-group">
                                <label for="gridSize">격자 밀도:</label>
                                <input type="range" id="gridSize" min="50" max="200" value="100" step="10">
                                <span id="gridSizeValue">100</span>
                            </div>
                            <div class="control-group">
                                <label for="colorIntensity">색상 강도:</label>
                                <input type="range" id="colorIntensity" min="0.3" max="1.0" value="0.7" step="0.1">
                                <span id="colorIntensityValue">0.7</span>
                            </div>
                            <div class="control-group">
                                <button id="resetView" class="btn-primary">초기화</button>
                                <button id="toggleAnimation" class="btn-secondary">애니메이션</button>
                            </div>
                        </div>

                        <!-- Legend -->
                        <div class="legend-panel">
                            <h4>범례</h4>
                            <div class="legend-items" id="legendItems"></div>
                        </div>
                    </div>

                    <!-- Phone home button -->
                    <div class="phone-button"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../src/utils/inequality-parser.js"></script>
    <script src="../src/utils/color-utils.js"></script>
    <script src="../src/components/overlap-field-renderer.js"></script>
    <script src="../src/components/smartphone-controller.js"></script>
    <script>
        // Initialize the app when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            window.overlapFieldApp = new OverlapFieldApp();

            // Listen for messages from Moodle parent window
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'PROBLEM_DATA') {
                    window.overlapFieldApp.loadProblem(event.data.data);
                }
            });

            // Demo data for standalone testing
            if (window.location.search.includes('demo')) {
                const demoData = {
                    name: '연립부등식 데모',
                    inequalities: [
                        'y > 2*x + 1',
                        'y < -x + 5',
                        'y > -0.5*x - 2',
                        'x > -3',
                        'x < 4'
                    ],
                    config: {
                        xMin: -5,
                        xMax: 5,
                        yMin: -5,
                        yMax: 5,
                        showGrid: true,
                        showAxes: true
                    }
                };
                window.overlapFieldApp.loadProblem(demoData);
            }
        });
    </script>
</body>
</html>
