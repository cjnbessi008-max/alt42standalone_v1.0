<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 성과 분석 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .feature-list {
            margin: 30px 0;
        }

        .feature-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin: 10px 0;
            background: #f8f9fa;
            border-radius: 10px;
            transition: transform 0.2s;
        }

        .feature-item:hover {
            transform: translateX(5px);
            background: #e9ecef;
        }

        .feature-icon {
            font-size: 24px;
            margin-right: 15px;
        }

        .feature-text {
            flex: 1;
        }

        .feature-text h3 {
            color: #333;
            margin-bottom: 5px;
            font-size: 1.1em;
        }

        .feature-text p {
            color: #666;
            font-size: 0.9em;
        }

        .input-group {
            margin: 20px 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 학생 성과 분석 시스템</h1>
        <p class="subtitle">Moodle LMS 연동 학습 패턴 분석</p>

        <div class="feature-list">
            <div class="feature-item">
                <span class="feature-icon">📊</span>
                <div class="feature-text">
                    <h3>최상위권 사고 루틴 분석</h3>
                    <p>상위 10% 학생들의 평균 학습 패턴 추출</p>
                </div>
            </div>

            <div class="feature-item">
                <span class="feature-icon">📈</span>
                <div class="feature-text">
                    <h3>개인별 편차 분석</h3>
                    <p>각 학생과 최상위권 간 차이 분석 및 시각화</p>
                </div>
            </div>

            <div class="feature-item">
                <span class="feature-icon">💡</span>
                <div class="feature-text">
                    <h3>맞춤형 개선 방안</h3>
                    <p>데이터 기반 학습 개선 권장사항 제공</p>
                </div>
            </div>

            <div class="feature-item">
                <span class="feature-icon">📋</span>
                <div class="feature-text">
                    <h3>상세 리포트</h3>
                    <p>JSON, CSV 형식의 분석 결과 다운로드</p>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label for="courseId">Moodle 코스 ID</label>
            <input type="number" id="courseId" placeholder="예: 1" min="1">
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="runAnalysis()">분석 시작</button>
            <button class="btn-secondary" onclick="viewDashboard()">대시보드 보기</button>
        </div>

        <div id="status" class="status"></div>
    </div>

    <script>
        async function runAnalysis() {
            const courseId = document.getElementById('courseId').value;
            const statusDiv = document.getElementById('status');

            if (!courseId) {
                showStatus('error', '코스 ID를 입력해주세요.');
                return;
            }

            showStatus('info', '<span class="spinner"></span>분석을 진행 중입니다. 데이터 양에 따라 몇 분이 소요될 수 있습니다...');

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ course_id: parseInt(courseId) })
                });

                const result = await response.json();

                if (result.success) {
                    showStatus('success',
                        `✅ 분석 완료!<br>
                        - 전체 학생: ${result.total_students}명<br>
                        - 분석 완료: ${result.analyzed_students}명<br>
                        - 최상위권: ${result.top_tier_count}명<br>
                        <br><a href="/course/${courseId}" style="color: #155724; font-weight: bold;">결과 보기 →</a>`
                    );
                } else {
                    showStatus('error', `❌ 분석 실패: ${result.error}`);
                }
            } catch (error) {
                showStatus('error', `❌ 오류 발생: ${error.message}`);
            }
        }

        function viewDashboard() {
            window.location.href = '/dashboard';
        }

        function showStatus(type, message) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.innerHTML = message;
            statusDiv.style.display = 'block';
        }
    </script>
</body>
</html>
