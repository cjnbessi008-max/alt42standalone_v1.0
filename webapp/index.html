<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alt42 - LMS 연동 학습 앱</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- 메인 컨텐츠 영역 -->
        <div class="main-content">
            <h1>학습 진행 현황</h1>

            <!-- 문제 정보 표시 영역 -->
            <div class="problem-info" id="problemInfo">
                <h2>문제 정보</h2>
                <div id="problemDetails">
                    <p>LMS에서 데이터를 불러오는 중...</p>
                </div>
            </div>

            <!-- Log 그래프 영역 -->
            <div class="graph-container">
                <h2>학습 로그 분석</h2>
                <canvas id="logChart"></canvas>
            </div>
        </div>

        <!-- 우측 하단 가상 스마트폰 화면 -->
        <div class="smartphone-display">
            <div class="smartphone-frame">
                <div class="smartphone-screen">
                    <div class="smartphone-header">
                        <span class="time" id="currentTime">10:30</span>
                        <div class="status-icons">
                            <span class="signal">📶</span>
                            <span class="battery">🔋</span>
                        </div>
                    </div>

                    <div class="app-content" id="appContent">
                        <h3>학습 앱</h3>
                        <div class="problem-display" id="mobileProblem">
                            <p>문제를 불러오는 중...</p>
                        </div>

                        <!-- 미니 로그 그래프 -->
                        <div class="mini-graph">
                            <canvas id="miniLogChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/moodle-connector.js"></script>
    <script src="js/log-graph.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
