<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a90e2">
    <meta name="description" content="LMS 연동 로그 감성 시각화 - AI 기반 학습 분석">
    <title>Curvy Log - Emotional Log Animation</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Curvy Log">
    <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
                <div>
                    <h1>Curvy Log Viewer</h1>
                    <p>LMS 연동 로그 감성 시각화</p>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button onclick="window.location.href='dashboard.html'" class="btn-secondary" style="padding: 10px 20px;">
                        📊 대시보드
                    </button>
                    <button onclick="window.location.href='recommendations.html'" class="btn-secondary" style="padding: 10px 20px;">
                        🤖 AI 추천
                    </button>
                </div>
            </div>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="userId">User ID:</label>
                <input type="number" id="userId" value="2" min="1">
            </div>

            <div class="control-group">
                <label for="dataType">Data Type:</label>
                <select id="dataType">
                    <option value="quiz">Quiz Attempts</option>
                    <option value="log">Activity Logs</option>
                </select>
            </div>

            <div class="control-group">
                <label for="animationSpeed">Animation Speed:</label>
                <input type="range" id="animationSpeed" min="0.5" max="5" step="0.5" value="2">
                <span id="speedValue">2x</span>
            </div>

            <div class="control-group">
                <label for="curveIntensity">Curve Intensity:</label>
                <input type="range" id="curveIntensity" min="0" max="1" step="0.1" value="0.6">
                <span id="curveValue">0.6</span>
            </div>

            <button id="loadData" class="btn-primary">Load Data</button>
            <button id="playAnimation" class="btn-secondary">Play Animation</button>
        </div>

        <div class="main-content">
            <div class="info-panel">
                <h3>Data Information</h3>
                <div id="dataInfo">
                    <p>No data loaded yet. Click "Load Data" to begin.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Virtual Smartphone Display (Bottom Right) -->
    <div id="smartphone" class="smartphone">
        <div class="smartphone-header">
            <div class="camera"></div>
            <div class="speaker"></div>
        </div>

        <div class="smartphone-screen">
            <div class="screen-header">
                <h4>Curvy Log</h4>
                <span id="currentTime">--:--</span>
            </div>

            <canvas id="curvyCanvas" width="340" height="600"></canvas>

            <div class="screen-footer">
                <div id="currentPoint" class="data-point-info">
                    <span class="label">Waiting for data...</span>
                </div>
            </div>
        </div>

        <div class="smartphone-footer">
            <div class="home-button"></div>
        </div>
    </div>

    <script src="js/curvy-log.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pwa-install.js"></script>
</body>
</html>
