<html lang="ko">
<head>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .chat-container {
            padding: 30px;
            min-height: 400px;
            max-height: 600px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bot-message {
            background: #f0f0f0;
            padding: 15px 20px;
            border-radius: 15px 15px 15px 0;
            margin-right: 50px;
            position: relative;
        }

        .bot-message::before {
            content: "🤖";
            position: absolute;
            left: -35px;
            top: 10px;
            font-size: 24px;
        }

        .user-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 15px 15px 0 15px;
            margin-left: 50px;
            text-align: right;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .choice-btn {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 15px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: left;
        }

        .choice-btn:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .choice-btn:active {
            transform: scale(0.98);
        }

        .result-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .result-card h2 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .result-card h3 {
            font-size: 18px;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .result-card ul {
            list-style: none;
            padding-left: 0;
        }

        .result-card li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
        }

        .result-card li::before {
            content: "✨";
            position: absolute;
            left: 0;
        }

        .restart-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
        }

        .progress-bar {
            background: #e0e0e0;
            height: 6px;
            border-radius: 3px;
            margin: 20px 30px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            transition: width 0.5s ease;
        }

        .typing-indicator {
            display: inline-block;
            padding: 15px 20px;
            background: #f0f0f0;
            border-radius: 15px;
            margin-right: 50px;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 22px;
            }

            .chat-container {
                padding: 20px;
            }

            .bot-message {
                margin-right: 20px;
            }

            .user-message {
                margin-left: 20px;
            }
        }
    </style>
</head>

                    '논리적 오류 찾아보기',
                    '다양한 관점에서 문제 바라보기',
                    '토론과 논쟁 활동에 참여하기'
                ]
            },
            empathy: {
                title: '공감과 소통 💝',
                description: 'AI가 대신할 수 없는 인간 관계의 핵심!',
                howTo: [
                    '다른 사람의 입장에서 생각해보기',
                    '경청하는 연습하기',
                    '감정을 표현하고 이해하기',
                    '다양한 사람들과 협업 프로젝트 하기'
                ]
            },
            adaptability: {
                title: '적응력과 학습 능력 📖',
                description: '변화하는 세상에서 가장 중요한 능력!',
                howTo: [
                    '새로운 도구와 기술을 두려워하지 않기',
                    '실패를 배움의 기회로 여기기',
                    '다양한 분야에 호기심 갖기',
                    '평생 학습하는 마인드셋 키우기'
                ]
            }
        };

        // 상태 관리
        let currentNode = 'start';
        let userChoices = {
            category: '',
            interest: '',
            style: '',
            skill: ''
        };
        let questionCount = 0;
        const totalQuestions = 4;

        // DOM 요소
        const chatContainer = document.getElementById('chatContainer');
        const progressBar = document.getElementById('progressBar');

        // 메시지 추가 함수
        function addMessage(text, isBot = true) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';

            const contentDiv = document.createElement('div');
            contentDiv.className = isBot ? 'bot-message' : 'user-message';
            contentDiv.innerHTML = text.replace(/\n/g, '<br>');

            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 타이핑 인디케이터 추가
        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message';
            typingDiv.id = 'typing-indicator';

            const indicatorDiv = document.createElement('div');
            indicatorDiv.className = 'typing-indicator';
            indicatorDiv.innerHTML = '<span></span><span></span><span></span>';

            typingDiv.appendChild(indicatorDiv);
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 타이핑 인디케이터 제거
        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // 버튼 추가 함수
        function addButtons(buttons) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';

            const buttonsContainer = document.createElement('div');
            buttonsContainer.className = 'buttons-container';

            buttons.forEach(button => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = button.text;
                btn.onclick = () => handleChoice(button);
                buttonsContainer.appendChild(btn);
            });

            messageDiv.appendChild(buttonsContainer);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 선택 처리 함수
        function handleChoice(button) {
            // 사용자 선택 저장
            if (button.category) userChoices.category = button.category;
            if (button.interest) userChoices.interest = button.interest;
            if (button.style) userChoices.style = button.style;
            if (button.skill) userChoices.skill = button.skill;

            // 사용자 메시지 표시
            addMessage(button.text, false);

            // 모든 버튼 비활성화
            const allButtons = document.querySelectorAll('.choice-btn');
            allButtons.forEach(btn => {
                btn.disabled = true;
                btn.style.opacity = '0.5';
                btn.style.cursor = 'not-allowed';
            });

            // 진행률 업데이트
            if (button.next === 'q2' || button.next === 'q3' || button.next === 'q4' || button.next === 'result') {
                questionCount++;
                updateProgress();
            }

            // 다음 메시지 표시 (딜레이 포함)
            setTimeout(() => {
                showTypingIndicator();
                setTimeout(() => {
                    removeTypingIndicator();
                    showNextNode(button.next);
                }, 1000);
            }, 500);
        }

        // 진행률 업데이트
        function updateProgress() {
            const progress = (questionCount / totalQuestions) * 100;
            progressBar.style.width = progress + '%';
        }

        // 다음 노드 표시
        function showNextNode(nodeId) {
            currentNode = nodeId;
            const node = conversationData[nodeId];

            if (node.isResult) {
                showResult();
            } else {
                addMessage(node.message);
                setTimeout(() => {
                    addButtons(node.buttons);
                }, 300);
            }
        }

        // 결과 표시
        function showResult() {
            // 직업 선택 로직
            const jobKey = `${userChoices.category}-${userChoices.interest}`;
            const job = futureJobs[jobKey] || futureJobs['creative-technology']; // 기본값

            const skillInfo = aiSkills[userChoices.skill];

            // 결과 메시지 생성
            let resultHTML = `
                <div class="result-card">
                    <h2>🎉 ${job.title}</h2>
                    <p style="font-size: 18px; margin: 15px 0;">${job.description}</p>

                    <h3>💡 왜 이 직업이 미래에 중요할까?</h3>
                    <p>${job.why}</p>

                    <h3>🎯 필요한 능력들</h3>
                    <ul>
                        ${job.skills.map(skill => `<li>${skill}</li>`).join('')}
                    </ul>

                    <h3>⚡ 너가 선택한 핵심 능력: ${skillInfo.title}</h3>
                    <p>${skillInfo.description}</p>

                    <h3>📚 이렇게 키워보자!</h3>
                    <ul>
                        ${skillInfo.howTo.map(how => `<li>${how}</li>`).join('')}
                    </ul>

                    <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.3);">
                        <p style="font-size: 16px;">
                            <strong>기억해!</strong> AI 시대에는 AI를 도구로 활용하면서도,
                            인간만이 가진 <strong>창의성, 공감, 비판적 사고</strong>가 가장 중요해.
                            지금부터 이런 능력들을 키워나가면, 어떤 미래가 와도 너는 빛날 수 있어! ✨
                        </p>
                    </div>

                    <button class="restart-btn" onclick="restart()">🔄 다시 시작하기</button>
                </div>
            `;

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.innerHTML = resultHTML;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 재시작 함수
        function restart() {
            currentNode = 'start';
            userChoices = {
                category: '',
                interest: '',
                style: '',
                skill: ''
            };
            questionCount = 0;
            chatContainer.innerHTML = '';
            updateProgress();
            init();
        }

        // 초기화
        function init() {
            const startNode = conversationData[currentNode];
            addMessage(startNode.message);
            setTimeout(() => {
                addButtons(startNode.buttons);
            }, 500);
        }

        // 페이지 로드 시 시작
        window.addEventListener('load', () => {
            setTimeout(init, 300);
        });
    </script>
</body>
</html>
