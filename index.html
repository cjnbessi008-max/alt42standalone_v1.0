<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation Trail - 계산 과정 시각화</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/operation-trail.css">
</head>
<body>
    <div class="container">
        <!-- 좌측: 문제 영역 -->
        <div class="problem-section">
            <div class="header">
                <h1>수학 문제 풀이</h1>
                <div class="connection-status">
                    <span id="moodle-status" class="status-badge">Moodle 연결 대기중...</span>
                </div>
            </div>

            <div class="problem-display">
                <h2>문제</h2>
                <div id="problem-content" class="problem-content">
                    <!-- Moodle에서 문제 로드 -->
                    <p class="loading">문제를 불러오는 중...</p>
                </div>
            </div>

            <div class="control-panel">
                <button id="btn-load-problem" class="btn btn-primary">문제 불러오기</button>
                <button id="btn-start-trail" class="btn btn-success">계산 과정 보기</button>
                <button id="btn-reset" class="btn btn-secondary">초기화</button>
            </div>
        </div>

        <!-- 우측 하단: 가상 스마트폰 화면 -->
        <div class="mobile-simulator">
            <div class="phone-frame">
                <div class="phone-notch"></div>
                <div class="phone-screen">
                    <div class="phone-header">
                        <span class="time">12:00</span>
                        <div class="phone-icons">
                            <span>📶</span>
                            <span>📡</span>
                            <span>🔋</span>
                        </div>
                    </div>

                    <!-- Operation Trail 캔버스 -->
                    <div class="trail-container">
                        <h3>계산 과정 (Operation Trail)</h3>
                        <canvas id="operation-trail-canvas" width="360" height="640"></canvas>
                        <div id="trail-steps" class="trail-steps"></div>
                    </div>

                    <div class="phone-footer">
                        <div class="home-indicator"></div>
                    </div>
                </div>
                <div class="phone-button"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/moodle-connector.js"></script>
    <script src="assets/js/operation-trail.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
