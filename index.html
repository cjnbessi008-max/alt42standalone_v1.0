<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALT42 - AI Learning Tool</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/smartphone.css">
</head>
<body>
    <!-- Main Content Area -->
    <div class="main-container">
        <header>
            <h1>ALT42 Learning System</h1>
            <div class="user-info">
                <span id="username">Loading...</span>
                <span id="total-score" class="score-display">0</span>
            </div>
        </header>

        <main>
            <div class="content-area">
                <div id="problem-container">
                    <h2>Current Problem</h2>
                    <div id="problem-content">
                        <p class="loading">Connecting to LMS...</p>
                    </div>
                    <div id="answer-input">
                        <input type="text" id="user-answer" placeholder="Enter your answer">
                        <button id="submit-btn">Submit</button>
                    </div>
                </div>

                <div id="feedback-area"></div>
            </div>
        </main>
    </div>

    <!-- Virtual Smartphone (Right Bottom Corner) -->
    <div id="smartphone-container">
        <div class="smartphone-frame">
            <div class="smartphone-screen">
                <!-- Power Display -->
                <div class="power-header">
                    <div class="power-icon">⚡</div>
                    <div class="power-label">POWER</div>
                </div>

                <!-- Power Score with Animation -->
                <div class="power-score-container">
                    <canvas id="power-charge-canvas"></canvas>
                    <div id="power-score" class="power-score">0</div>
                    <div class="power-bar-container">
                        <div id="power-bar" class="power-bar"></div>
                    </div>
                </div>

                <!-- Stats Display -->
                <div class="stats-container">
                    <div class="stat-item">
                        <span class="stat-label">Streak</span>
                        <span id="streak-count" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Level</span>
                        <span id="level" class="stat-value">1</span>
                    </div>
                </div>

                <!-- Recent Activity -->
                <div class="activity-log">
                    <h3>Recent</h3>
                    <ul id="activity-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/moodleAPI.js"></script>
    <script src="js/powerCharge.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
