<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 페이스메이커 - 학습 플레이리스트 매칭</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <div class="pacemaker-animation" id="pacemakerAnimation">
                <div class="runner">🏃‍♂️</div>
                <div class="message">난 죽을힘을 다해 달리고 있다. 넌 공부해라!</div>
            </div>
            <h1>AI 페이스메이커</h1>
            <p class="subtitle">당신의 학습을 응원합니다</p>
        </header>

        <!-- 키워드 입력 섹션 -->
        <section class="keyword-section">
            <div class="input-group">
                <label for="keywordInput">오늘의 학습 키워드를 입력하세요:</label>
                <input
                    type="text"
                    id="keywordInput"
                    placeholder="예: 수학, 코딩, 집중, 영어..."
                    autocomplete="off"
                >
                <button id="matchButton" class="btn-primary">
                    <span>매칭하기</span>
                    <span class="icon">🎵</span>
                </button>
            </div>
            <div id="loadingIndicator" class="loading hidden">
                <div class="spinner"></div>
                <p>AI가 최적의 플레이리스트를 찾고 있습니다...</p>
            </div>
        </section>

        <!-- 응원 메시지 -->
        <div id="encouragementMessage" class="encouragement hidden">
            <div class="encouragement-content">
                <div class="running-animation">
                    <div class="runner-large">🏃‍♂️💨</div>
                </div>
                <p class="encouragement-text"></p>
            </div>
        </div>

        <!-- 매칭 결과 -->
        <section id="resultSection" class="result-section hidden">
            <h2>추천 플레이리스트</h2>
            <div id="matchedPlaylist" class="matched-playlist"></div>
        </section>

        <!-- 전체 플레이리스트 목록 -->
        <section class="playlist-section">
            <div class="section-header">
                <h2>전체 플레이리스트</h2>
                <button id="toggleHiddenBtn" class="btn-secondary">
                    <span id="toggleHiddenText">숨김 보기</span>
                    <span class="icon">👁️</span>
                </button>
            </div>
            <div id="playlistContainer" class="playlist-container"></div>
        </section>

        <!-- API 키 설정 모달 -->
        <div id="apiKeyModal" class="modal">
            <div class="modal-content">
                <h2>OpenAI API 키 설정</h2>
                <p>OpenAI API 키를 입력해주세요:</p>
                <input
                    type="password"
                    id="apiKeyInput"
                    placeholder="sk-..."
                    autocomplete="off"
                >
                <div class="modal-buttons">
                    <button id="saveApiKeyBtn" class="btn-primary">저장</button>
                    <button id="skipApiKeyBtn" class="btn-secondary">건너뛰기</button>
                </div>
                <p class="api-note">
                    <small>API 키는 브라우저에만 저장되며, 외부로 전송되지 않습니다.</small>
                </p>
            </div>
        </div>

        <!-- 푸터 -->
        <footer class="footer">
            <p>💪 열심히 달리는 AI가 당신을 응원합니다!</p>
            <p class="footer-note">
                <small>AI 페이스메이커와 함께 최고의 학습 경험을 만들어보세요</small>
            </p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
