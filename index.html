<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 도형 학습 앱 - Inner View Mode</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <div class="container">
        <!-- 좌측: 문제 정보 영역 -->
        <div class="problem-panel">
            <div class="problem-header">
                <h2>문제 정보</h2>
                <div id="connection-status" class="status-indicator">연결 대기중...</div>
            </div>
            <div id="problem-content" class="problem-content">
                <p>Moodle에서 문제를 불러오는 중...</p>
            </div>
        </div>

        <!-- 우측 하단: 가상 스마트폰 화면 -->
        <div class="smartphone-container">
            <div class="smartphone-frame">
                <div class="smartphone-screen">
                    <!-- 상단 컨트롤 바 -->
                    <div class="control-bar">
                        <h3 id="shape-title">3D 도형 뷰어</h3>
                        <div class="controls">
                            <button id="inner-view-toggle" class="btn-control" title="내부 구조 보기">
                                <span class="icon">👁️</span>
                                Inner View
                            </button>
                            <button id="reset-view" class="btn-control" title="시점 초기화">
                                <span class="icon">🔄</span>
                                Reset
                            </button>
                        </div>
                    </div>

                    <!-- 3D 렌더링 영역 -->
                    <div id="canvas-container" class="canvas-container">
                        <!-- Three.js 캔버스가 여기에 삽입됩니다 -->
                    </div>

                    <!-- 하단 정보 패널 -->
                    <div class="info-panel">
                        <div class="transparency-control">
                            <label for="transparency-slider">투명도</label>
                            <input type="range" id="transparency-slider" min="0" max="100" value="0" disabled>
                            <span id="transparency-value">0%</span>
                        </div>
                        <div class="shape-info">
                            <p id="shape-description">도형을 선택하면 정보가 표시됩니다.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Three.js 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- 애플리케이션 스크립트 -->
    <script src="src/js/moodle-connector.js"></script>
    <script src="src/js/shape-renderer.js"></script>
    <script src="src/js/inner-view-mode.js"></script>
    <script src="src/js/app.js"></script>
</body>
</html>
