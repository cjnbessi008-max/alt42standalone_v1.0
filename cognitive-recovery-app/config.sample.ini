; Cognitive Recovery Detection System Configuration
; Copy this file to config.ini and update with your settings

[database]
db_host = localhost
db_name = cognitive_recovery_db
db_user = root
db_password =
db_charset = utf8mb4

[moodle]
; Moodle installation URL (without trailing slash)
moodle_url = http://your-moodle-site.com

; Moodle Web Service Token
; Generate at: Site administration > Server > Web services > Manage tokens
moodle_token = your_moodle_web_service_token_here

[tracking]
; Minimum seconds for cognitive recovery detection
cognitive_recovery_min_duration = 10

; Maximum seconds for cognitive recovery (above is considered dropout)
cognitive_recovery_max_duration = 60

; Maximum seconds for micro break
micro_break_max_duration = 10

; Minimum seconds for extended pause
extended_pause_min_duration = 60

; Seconds of inactivity to consider dropout
dropout_threshold = 300

; Milliseconds between activity checks
activity_tracking_interval = 1000

; Seconds window for intensity calculation
intensity_calculation_window = 60

[application]
; Application base URL
base_url = http://localhost/cognitive-recovery-app

; Enable debug mode
debug_mode = true

; Session timeout in seconds
session_timeout = 3600

[notifications]
; Enable email notifications
email_notifications = false

; Admin email for notifications
admin_email = admin@example.com

[analytics]
; Data retention period in days
data_retention_days = 90

; Enable advanced analytics
advanced_analytics = true

; Minimum sessions for pattern analysis
min_sessions_for_patterns = 5
