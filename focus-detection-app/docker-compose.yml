version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: focus-detection-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/focus_detection.db:/app/focus_detection.db
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./focus_detection.db
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - focus-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: focus-detection-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    command: npm run dev -- --host
    depends_on:
      - backend
    networks:
      - focus-network

networks:
  focus-network:
    driver: bridge
