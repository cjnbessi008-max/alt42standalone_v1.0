<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Icon Generator - Curvy Log</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .canvas-container {
            display: none;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .preview-item {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            transition: transform 0.3s;
        }

        .preview-item:hover {
            transform: translateY(-5px);
        }

        .preview-item img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .preview-item p {
            margin-top: 10px;
            font-size: 0.9em;
            color: #333;
        }

        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9em;
        }

        .download-btn:hover {
            background: #5568d3;
        }

        .generate-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .instructions {
            background: #f0f4ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }

        .instructions h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .instructions ol {
            margin-left: 20px;
        }

        .instructions li {
            margin-bottom: 10px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 PWA Icon Generator</h1>
        <p>Curvy Log 앱을 위한 모든 크기의 아이콘을 자동으로 생성합니다</p>

        <div class="instructions">
            <h3>사용 방법</h3>
            <ol>
                <li>"아이콘 생성" 버튼을 클릭하세요</li>
                <li>생성된 아이콘 미리보기가 아래에 표시됩니다</li>
                <li>각 아이콘을 개별적으로 다운로드하거나 "모두 다운로드" 버튼을 사용하세요</li>
                <li>다운로드한 아이콘을 <code>/assets/icons/</code> 폴더에 저장하세요</li>
            </ol>
        </div>

        <button class="generate-btn" onclick="generateAllIcons()">🚀 아이콘 생성</button>

        <div class="canvas-container">
            <canvas id="iconCanvas"></canvas>
        </div>

        <div id="previewGrid" class="preview-grid"></div>
    </div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const generatedIcons = {};

        function generateAllIcons() {
            const previewGrid = document.getElementById('previewGrid');
            previewGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">아이콘 생성 중...</p>';

            setTimeout(() => {
                previewGrid.innerHTML = '';
                sizes.forEach(size => {
                    const dataUrl = generateIcon(size);
                    generatedIcons[size] = dataUrl;
                    addPreview(size, dataUrl);
                });

                // Add download all button
                const downloadAll = document.createElement('div');
                downloadAll.style.gridColumn = '1/-1';
                downloadAll.style.textAlign = 'center';
                downloadAll.style.marginTop = '20px';
                downloadAll.innerHTML = `
                    <button class="generate-btn" onclick="downloadAllIcons()">
                        💾 모든 아이콘 다운로드
                    </button>
                `;
                previewGrid.appendChild(downloadAll);
            }, 100);
        }

        function generateIcon(size) {
            const canvas = document.getElementById('iconCanvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Clear canvas
            ctx.clearRect(0, 0, size, size);

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient;

            // Rounded rectangle background
            const radius = size * 0.15;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fill();

            // Draw curved line (logo)
            const padding = size * 0.15;
            const width = size - padding * 2;
            const height = size - padding * 2;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = size * 0.04;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Smooth curve
            ctx.beginPath();
            const points = 20;
            for (let i = 0; i <= points; i++) {
                const t = i / points;
                const x = padding + width * t;
                const y = padding + height / 2 + Math.sin(t * Math.PI * 3) * height * 0.3;

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();

            // Add glow effect
            ctx.shadowBlur = size * 0.05;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Draw points on curve
            ctx.fillStyle = '#FFE66D';
            for (let i = 0; i <= points; i += 5) {
                const t = i / points;
                const x = padding + width * t;
                const y = padding + height / 2 + Math.sin(t * Math.PI * 3) * height * 0.3;

                ctx.beginPath();
                ctx.arc(x, y, size * 0.025, 0, Math.PI * 2);
                ctx.fill();
            }

            // Add text for larger icons
            if (size >= 192) {
                ctx.fillStyle = 'white';
                ctx.font = `bold ${size * 0.12}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('Curvy Log', size / 2, size - padding);
            }

            return canvas.toDataURL('image/png');
        }

        function addPreview(size, dataUrl) {
            const previewGrid = document.getElementById('previewGrid');
            const item = document.createElement('div');
            item.className = 'preview-item';
            item.innerHTML = `
                <img src="${dataUrl}" alt="${size}x${size} icon">
                <p><strong>${size}x${size}</strong></p>
                <a href="${dataUrl}" download="icon-${size}x${size}.png" class="download-btn">
                    다운로드
                </a>
            `;
            previewGrid.appendChild(item);
        }

        function downloadAllIcons() {
            Object.keys(generatedIcons).forEach(size => {
                const link = document.createElement('a');
                link.href = generatedIcons[size];
                link.download = `icon-${size}x${size}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });

            alert('모든 아이콘 다운로드가 시작되었습니다!');
        }

        // Auto-generate on load
        window.addEventListener('load', () => {
            setTimeout(generateAllIcons, 500);
        });
    </script>
</body>
</html>
