<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대칭 발견기 - Symmetry Discovery</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Main Application Container -->
    <div class="app-container">
        <!-- Desktop View - Instructions and Info -->
        <div class="desktop-panel">
            <h1>🔍 대칭 발견기</h1>
            <div class="instructions">
                <h2>사용 방법</h2>
                <ol>
                    <li>우측 스마트폰 화면에서 도형을 터치하세요</li>
                    <li>드래그하여 도형을 회전시키세요</li>
                    <li>정확한 대칭 위치에서 숨은 대칭선이 빛으로 나타납니다!</li>
                </ol>

                <div class="level-info">
                    <h3>현재 레벨: <span id="current-level">1</span></h3>
                    <p>발견한 대칭선: <span id="found-symmetries">0</span> / <span id="total-symmetries">0</span></p>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>

                <div class="score-board">
                    <h3>점수: <span id="score">0</span></h3>
                    <p>최고 기록: <span id="high-score">0</span></p>
                </div>

                <div class="shape-info">
                    <h3>도형 정보</h3>
                    <p id="shape-description">도형을 선택하세요</p>
                </div>
            </div>
        </div>

        <!-- Virtual Smartphone Display - Bottom Right -->
        <div class="smartphone-container">
            <div class="smartphone">
                <!-- Phone Frame -->
                <div class="phone-frame">
                    <!-- Notch -->
                    <div class="phone-notch"></div>

                    <!-- Screen -->
                    <div class="phone-screen">
                        <!-- Status Bar -->
                        <div class="status-bar">
                            <span class="time">12:34</span>
                            <div class="status-icons">
                                <span class="signal">📶</span>
                                <span class="battery">🔋</span>
                            </div>
                        </div>

                        <!-- App Content -->
                        <div class="app-content">
                            <div class="app-header">
                                <h2>대칭 발견기</h2>
                                <button id="next-shape-btn" class="btn-next">다음 도형</button>
                            </div>

                            <!-- Canvas for Shape Drawing -->
                            <canvas id="shape-canvas" width="300" height="400"></canvas>

                            <!-- Feedback Message -->
                            <div id="feedback-message" class="feedback-message"></div>

                            <!-- Controls -->
                            <div class="controls">
                                <button id="reset-btn" class="btn-control">↻ 초기화</button>
                                <button id="hint-btn" class="btn-control">💡 힌트</button>
                            </div>
                        </div>
                    </div>

                    <!-- Home Button -->
                    <div class="phone-home-button"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Particle Effect Container -->
    <div id="particle-container"></div>

    <!-- Audio Elements -->
    <audio id="success-sound" preload="auto">
        <!-- Will use Web Audio API for synthesis -->
    </audio>

    <!-- Scripts -->
    <script src="js/shapes.js"></script>
    <script src="js/symmetry-detector.js"></script>
    <script src="js/particle-effects.js"></script>
    <script src="js/moodle-integration.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
