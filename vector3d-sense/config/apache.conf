# Vector 3D Sense - Apache Configuration
# Add this to your Apache virtual host configuration

<VirtualHost *:80>
    ServerName vector3d.example.com
    DocumentRoot /var/www/html/vector3d-sense/webapp

    # Enable rewrite module
    <Directory /var/www/html/vector3d-sense/webapp>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # API Alias
    Alias /api /var/www/html/vector3d-sense/api
    <Directory /var/www/html/vector3d-sense/api>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Enable PHP
        <FilesMatch \.php$>
            SetHandler application/x-httpd-php
        </FilesMatch>
    </Directory>

    # Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"

    # CORS Headers (if needed for LMS integration)
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization"

    # Error and Access logs
    ErrorLog ${APACHE_LOG_DIR}/vector3d-error.log
    CustomLog ${APACHE_LOG_DIR}/vector3d-access.log combined
</VirtualHost>
