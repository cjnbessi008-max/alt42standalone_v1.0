[tool.poetry]
name = "mathflow-backend"
version = "0.1.0"
description = "MathFlow Backend API"
authors = ["MathFlow Team"]

[tool.poetry.dependencies]
python = "^3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
