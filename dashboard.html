<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a90e2">
    <title>학습 대시보드 - Curvy Log</title>

    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .dashboard-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .stat-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .stat-value {
            font-size: 3em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #666;
            font-size: 1.1em;
            font-weight: 600;
        }

        .stat-change {
            margin-top: 10px;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9em;
            font-weight: 600;
            display: inline-block;
        }

        .stat-change.positive {
            background: #e0ffe0;
            color: #50c878;
        }

        .stat-change.negative {
            background: #ffe0e0;
            color: #ff6b6b;
        }

        .chart-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .chart-card h3 {
            margin: 0 0 20px 0;
            color: #333;
            font-size: 1.5em;
        }

        .chart-placeholder {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            height: 300px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 1.1em;
        }

        .recent-activity {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .activity-item {
            padding: 20px;
            border-left: 4px solid #667eea;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .activity-item:hover {
            transform: translateX(5px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .activity-time {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .activity-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .activity-score {
            color: #667eea;
            font-weight: 600;
        }

        .quick-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .quick-action-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quick-action-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .quick-action-btn.secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        @media (max-width: 1200px) {
            .chart-section {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .dashboard-header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .quick-actions {
                flex-direction: column;
            }

            .quick-action-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <div>
                <h1 style="margin: 0 0 10px 0;">📊 학습 대시보드</h1>
                <p style="margin: 0; opacity: 0.9;">당신의 학습 여정을 한눈에</p>
            </div>
            <div class="quick-actions">
                <button class="quick-action-btn primary" onclick="window.location.href='index.html'">
                    <span>📈</span> 로그 보기
                </button>
                <button class="quick-action-btn secondary" onclick="window.location.href='recommendations.html'">
                    <span>🤖</span> AI 추천
                </button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">🎯</div>
                <div class="stat-value" id="totalScore">--</div>
                <div class="stat-label">평균 점수</div>
                <span class="stat-change positive" id="scoreChange">--</span>
            </div>

            <div class="stat-card">
                <div class="stat-icon">📚</div>
                <div class="stat-value" id="totalLessons">--</div>
                <div class="stat-label">완료한 학습</div>
                <span class="stat-change positive" id="lessonChange">--</span>
            </div>

            <div class="stat-card">
                <div class="stat-icon">🔥</div>
                <div class="stat-value" id="streak">--</div>
                <div class="stat-label">연속 학습 일수</div>
                <span class="stat-change positive" id="streakStatus">--</span>
            </div>

            <div class="stat-card">
                <div class="stat-icon">⏱️</div>
                <div class="stat-value" id="totalTime">--</div>
                <div class="stat-label">총 학습 시간</div>
                <span class="stat-change positive" id="timeChange">--</span>
            </div>
        </div>

        <div class="chart-section">
            <div class="chart-card">
                <h3>학습 진척도</h3>
                <canvas id="progressChart" width="600" height="300"></canvas>
            </div>

            <div class="chart-card">
                <h3>주간 활동</h3>
                <canvas id="weeklyChart" width="300" height="300"></canvas>
            </div>
        </div>

        <div class="recent-activity">
            <h3 style="margin: 0 0 25px 0; color: #333;">최근 활동</h3>
            <div id="activityList">
                <div class="activity-item">
                    <div class="activity-time">Loading...</div>
                    <div class="activity-title">학습 데이터를 불러오는 중...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/curvy-log.js"></script>
    <script>
        let userData = [];
        let progressChart = null;
        let weeklyChart = null;

        document.addEventListener('DOMContentLoaded', async function() {
            await loadDashboardData();
            drawCharts();
        });

        async function loadDashboardData() {
            // Try to load from localStorage
            const stored = localStorage.getItem('curvyLogUserData');

            if (stored) {
                userData = JSON.parse(stored);
            } else {
                // Generate demo data
                userData = generateDemoData();
            }

            updateStats();
            updateRecentActivity();
        }

        function generateDemoData() {
            const data = [];
            const now = Date.now() / 1000;

            for (let i = 0; i < 30; i++) {
                const daysAgo = 30 - i;
                const baseScore = 60 + (i / 30) * 20 + Math.random() * 15;

                data.push({
                    x: i,
                    y: Math.log(baseScore + 1),
                    rawScore: baseScore,
                    timestamp: now - (daysAgo * 86400),
                    event: `학습 활동 ${i + 1}`,
                    quizName: ['기초 수학', '중급 대수', '고급 미적분'][Math.floor(i / 10)],
                    attempt: (i % 3) + 1,
                    timeTaken: 900 + Math.random() * 1800
                });
            }

            localStorage.setItem('curvyLogUserData', JSON.stringify(data));
            return data;
        }

        function updateStats() {
            // Average score
            const scores = userData.map(d => d.rawScore || d.y * 20).filter(s => s != null);
            const avgScore = scores.length > 0
                ? scores.reduce((a, b) => a + b, 0) / scores.length
                : 0;

            document.getElementById('totalScore').textContent = avgScore.toFixed(1);

            // Score change
            const recentAvg = scores.slice(-7).reduce((a, b) => a + b, 0) / Math.min(7, scores.length);
            const previousAvg = scores.slice(0, -7).reduce((a, b) => a + b, 0) / Math.max(1, scores.length - 7);
            const change = recentAvg - previousAvg;

            const scoreChangeEl = document.getElementById('scoreChange');
            scoreChangeEl.textContent = `${change >= 0 ? '+' : ''}${change.toFixed(1)} 지난 주 대비`;
            scoreChangeEl.className = `stat-change ${change >= 0 ? 'positive' : 'negative'}`;

            // Total lessons
            document.getElementById('totalLessons').textContent = userData.length;
            document.getElementById('lessonChange').textContent = '+' + Math.min(7, userData.length) + ' 이번 주';

            // Streak calculation
            const streak = calculateStreak(userData);
            document.getElementById('streak').textContent = streak;
            document.getElementById('streakStatus').textContent = streak > 0 ? '계속 유지 중!' : '새로 시작하기';

            // Total time
            const totalMinutes = userData.reduce((sum, d) => sum + (d.timeTaken || 0), 0) / 60;
            const hours = Math.floor(totalMinutes / 60);
            document.getElementById('totalTime').textContent = hours + 'h';
            document.getElementById('timeChange').textContent = '+' + Math.floor(totalMinutes / 7) + 'm 일평균';
        }

        function calculateStreak(data) {
            if (data.length === 0) return 0;

            const sortedData = [...data].sort((a, b) => b.timestamp - a.timestamp);
            const now = Date.now() / 1000;
            const oneDaySeconds = 86400;

            let streak = 0;
            let currentDay = Math.floor(now / oneDaySeconds);

            for (let item of sortedData) {
                const itemDay = Math.floor(item.timestamp / oneDaySeconds);

                if (itemDay === currentDay || itemDay === currentDay - 1) {
                    streak++;
                    currentDay = itemDay - 1;
                } else if (itemDay < currentDay - 1) {
                    break;
                }
            }

            return streak;
        }

        function updateRecentActivity() {
            const activityList = document.getElementById('activityList');
            const recentData = [...userData].sort((a, b) => b.timestamp - a.timestamp).slice(0, 5);

            if (recentData.length === 0) {
                activityList.innerHTML = `
                    <div class="activity-item">
                        <div class="activity-title">아직 활동 기록이 없습니다</div>
                    </div>
                `;
                return;
            }

            activityList.innerHTML = recentData.map(item => {
                const date = new Date(item.timestamp * 1000);
                const timeAgo = getTimeAgo(item.timestamp);

                return `
                    <div class="activity-item">
                        <div class="activity-time">${timeAgo}</div>
                        <div class="activity-title">${item.quizName || item.event}</div>
                        <div class="activity-score">점수: ${(item.rawScore || item.y * 20).toFixed(1)}</div>
                    </div>
                `;
            }).join('');
        }

        function getTimeAgo(timestamp) {
            const now = Date.now() / 1000;
            const diff = now - timestamp;

            if (diff < 3600) return Math.floor(diff / 60) + '분 전';
            if (diff < 86400) return Math.floor(diff / 3600) + '시간 전';
            if (diff < 604800) return Math.floor(diff / 86400) + '일 전';
            return Math.floor(diff / 604800) + '주 전';
        }

        function drawCharts() {
            drawProgressChart();
            drawWeeklyChart();
        }

        function drawProgressChart() {
            const canvas = document.getElementById('progressChart');
            const ctx = canvas.getContext('2d');

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (userData.length === 0) {
                ctx.fillStyle = '#999';
                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('데이터 없음', canvas.width / 2, canvas.height / 2);
                return;
            }

            // Setup
            const padding = 40;
            const width = canvas.width - padding * 2;
            const height = canvas.height - padding * 2;

            // Get scores
            const scores = userData.map(d => d.rawScore || d.y * 20);
            const maxScore = Math.max(...scores, 100);
            const minScore = Math.min(...scores, 0);

            // Draw grid
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;

            for (let i = 0; i <= 5; i++) {
                const y = padding + (height * i / 5);
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(canvas.width - padding, y);
                ctx.stroke();

                // Y-axis labels
                const value = maxScore - (maxScore - minScore) * i / 5;
                ctx.fillStyle = '#666';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(value.toFixed(0), padding - 10, y + 4);
            }

            // Draw line
            ctx.beginPath();
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            scores.forEach((score, i) => {
                const x = padding + (width * i / (scores.length - 1));
                const y = padding + height - ((score - minScore) / (maxScore - minScore)) * height;

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });

            ctx.stroke();

            // Draw gradient fill
            const gradient = ctx.createLinearGradient(0, padding, 0, canvas.height - padding);
            gradient.addColorStop(0, 'rgba(102, 126, 234, 0.3)');
            gradient.addColorStop(1, 'rgba(102, 126, 234, 0)');

            ctx.lineTo(canvas.width - padding, canvas.height - padding);
            ctx.lineTo(padding, canvas.height - padding);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();

            // Draw points
            scores.forEach((score, i) => {
                const x = padding + (width * i / (scores.length - 1));
                const y = padding + height - ((score - minScore) / (maxScore - minScore)) * height;

                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#667eea';
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }

        function drawWeeklyChart() {
            const canvas = document.getElementById('weeklyChart');
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Weekly activity count
            const now = Date.now() / 1000;
            const oneDaySeconds = 86400;
            const weekData = [0, 0, 0, 0, 0, 0, 0];
            const days = ['일', '월', '화', '수', '목', '금', '토'];

            userData.forEach(item => {
                const daysDiff = Math.floor((now - item.timestamp) / oneDaySeconds);
                if (daysDiff < 7) {
                    weekData[6 - daysDiff]++;
                }
            });

            // Draw bars
            const barWidth = 30;
            const maxCount = Math.max(...weekData, 1);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 100;

            weekData.forEach((count, i) => {
                const angle = (Math.PI * 2 * i / 7) - Math.PI / 2;
                const barHeight = (count / maxCount) * radius;

                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(x, y);
                ctx.strokeStyle = '#667eea';
                ctx.lineWidth = barWidth;
                ctx.stroke();

                // Labels
                const labelX = centerX + Math.cos(angle) * (radius + 30);
                const labelY = centerY + Math.sin(angle) * (radius + 30);

                ctx.fillStyle = '#666';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(days[i], labelX, labelY);
                ctx.fillText(count, labelX, labelY + 15);
            });

            // Center circle
            ctx.beginPath();
            ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Export for debugging
        window.userData = userData;
        window.loadDashboardData = loadDashboardData;
    </script>
</body>
</html>
