<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derivative Focus - Virtual Smartphone Display</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Derivative Focus</h1>
            <p>미분 문제 핵심 규칙 자동 강조 시스템</p>
        </header>

        <main>
            <!-- Control Panel -->
            <div class="control-panel">
                <h2>문제 불러오기</h2>
                <div class="input-group">
                    <label for="questionId">Moodle 문제 ID:</label>
                    <input type="number" id="questionId" placeholder="예: 12345">
                    <button onclick="loadProblemFromMoodle()">불러오기</button>
                </div>

                <div class="input-group">
                    <label for="directInput">또는 직접 입력:</label>
                    <textarea id="directInput" rows="3" placeholder="미분 문제를 입력하세요 (LaTeX 지원)"></textarea>
                    <button onclick="analyzeDirect()">분석하기</button>
                </div>
            </div>

            <!-- Virtual Smartphone Display (Bottom Right) -->
            <div class="smartphone-container">
                <div class="smartphone">
                    <div class="smartphone-notch"></div>
                    <div class="smartphone-screen">
                        <div class="app-header">
                            <span class="app-title">Derivative Focus</span>
                        </div>

                        <div class="problem-display" id="problemDisplay">
                            <div class="welcome-message">
                                <p>👋 환영합니다!</p>
                                <p>미분 문제를 불러오면<br>핵심 규칙 3가지가<br>자동으로 강조됩니다.</p>
                            </div>
                        </div>

                        <div class="rules-panel" id="rulesPanel">
                            <h3>검출된 핵심 규칙</h3>
                            <div id="rulesList" class="rules-list">
                                <p class="no-rules">규칙이 검출되지 않았습니다</p>
                            </div>
                        </div>
                    </div>
                    <div class="smartphone-home-button"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
