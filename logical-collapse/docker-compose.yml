version: '3.8'

services:
  # MySQL 5.7 Database
  mysql:
    image: mysql:5.7
    container_name: logical-collapse-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-logical_collapse}
      MYSQL_USER: ${DB_USER:-appuser}
      MYSQL_PASSWORD: ${DB_PASS:-apppass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - logical-collapse-network

  # PHP 7.1.9 Backend API
  php-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logical-collapse-api
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-logical_collapse}
      DB_USER: ${DB_USER:-appuser}
      DB_PASS: ${DB_PASS:-apppass}
      MOODLE_URL: ${MOODLE_URL}
      MOODLE_TOKEN: ${MOODLE_TOKEN}
    depends_on:
      - mysql
    networks:
      - logical-collapse-network

  # React Frontend
  react-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: logical-collapse-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    environment:
      REACT_APP_API_URL: http://localhost:8080/api
      REACT_APP_MOODLE_TOKEN: ${REACT_APP_MOODLE_TOKEN}
    depends_on:
      - php-backend
    networks:
      - logical-collapse-network

  # PHPMyAdmin (Optional - for database management)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: logical-collapse-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-rootpass}
    depends_on:
      - mysql
    networks:
      - logical-collapse-network

networks:
  logical-collapse-network:
    driver: bridge

volumes:
  mysql_data:
