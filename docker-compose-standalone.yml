version: '3.8'

services:
  # MySQL 5.7 Database
  mysql:
    image: mysql:5.7
    container_name: geospiral_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: geospiral_db
      MYSQL_USER: geospiral
      MYSQL_PASSWORD: geospiral123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema-standalone.sql:/docker-entrypoint-initdb.d/schema.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Node.js Backend API
  backend:
    image: node:16-alpine
    container_name: geospiral_backend
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./src/backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=geospiral
      - DB_PASSWORD=geospiral123
      - DB_NAME=geospiral_db
      - JWT_SECRET=geospiral-dev-secret-key
      - JWT_EXPIRES_IN=7d
      - FRONTEND_URL=http://localhost:3000
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped

  # React Frontend
  frontend:
    image: node:16-alpine
    container_name: geospiral_frontend
    working_dir: /app
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:5000/api
      - REACT_APP_USE_MOCK=false
    command: sh -c "npm install && npm start"
    restart: unless-stopped

volumes:
  mysql_data:
