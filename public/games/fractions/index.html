<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frani the Slice Fairy - 분수 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <div class="game-header">
            <div class="header-left">
                <div class="spirit-avatar">🧚‍♀️</div>
                <div class="spirit-info">
                    <h2>조각요정 프라니</h2>
                    <p id="stage-name">Loading...</p>
                </div>
            </div>
            <div class="header-right">
                <div class="score-display">
                    <span id="current-score">0</span> / 100
                </div>
            </div>
        </div>

        <!-- Main Game Area -->
        <div class="game-area">
            <!-- Fairy Character -->
            <div class="fairy-container">
                <div class="fairy" id="fairy">
                    <div class="fairy-face">
                        <div class="fairy-eyes">
                            <div class="eye"></div>
                            <div class="eye"></div>
                        </div>
                        <div class="fairy-mouth" id="fairy-mouth">😊</div>
                    </div>
                </div>
                <div class="fairy-message" id="fairy-message">
                    안녕! 나는 조각요정 프라니야! 함께 나눠볼까?
                </div>
            </div>

            <!-- Food Item (Pizza, Cake, etc.) -->
            <canvas id="food-canvas" width="300" height="300"></canvas>

            <!-- Controls -->
            <div class="controls">
                <button id="reset-btn" class="btn">다시 하기</button>
                <button id="check-btn" class="btn btn-primary">확인</button>
            </div>

            <!-- Instructions -->
            <div class="instructions" id="instructions">
                손가락으로 피자를 나눠보세요!
            </div>
        </div>

        <!-- Progress Indicator -->
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
        </div>

        <!-- Stage Complete Modal -->
        <div class="modal" id="complete-modal">
            <div class="modal-content">
                <div class="modal-icon">🎉</div>
                <h3 id="modal-title">잘했어요!</h3>
                <p id="modal-message">완벽하게 나눴어요!</p>
                <button id="next-stage-btn" class="btn btn-primary">다음 단계</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
