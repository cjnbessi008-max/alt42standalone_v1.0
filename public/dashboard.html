<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인지 능력 회복력 측정 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 16px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .stat-card .value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 12px;
            opacity: 0.8;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .assessment-container {
            display: none;
        }

        .assessment-container.active {
            display: block;
        }

        .question {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .question h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            background: white;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        .results {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }

        .results h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status.excellent {
            background: #4caf50;
            color: white;
        }

        .status.good {
            background: #8bc34a;
            color: white;
        }

        .status.moderate {
            background: #ffc107;
            color: #333;
        }

        .status.poor {
            background: #ff9800;
            color: white;
        }

        .status.declined {
            background: #f44336;
            color: white;
        }

        .timer {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            color: #667eea;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 인지 능력 회복력 측정 시스템</h1>
            <p>휴식 전후 인지 능력 변화를 측정하여 회복력을 평가합니다</p>
        </div>

        <div id="dashboard" class="card">
            <h2>대시보드</h2>

            <div class="grid">
                <div class="stat-card">
                    <h3>전체 평가 횟수</h3>
                    <div class="value" id="totalAssessments">0</div>
                    <div class="label">Total Assessments</div>
                </div>
                <div class="stat-card">
                    <h3>평균 회복률</h3>
                    <div class="value" id="avgRecovery">0%</div>
                    <div class="label">Average Recovery Rate</div>
                </div>
                <div class="stat-card">
                    <h3>최근 세션</h3>
                    <div class="value" id="recentSessions">0</div>
                    <div class="label">Recent Sessions</div>
                </div>
            </div>

            <div class="form-group">
                <label for="userId">사용자 ID</label>
                <input type="number" id="userId" placeholder="Moodle 사용자 ID 입력" value="1">
            </div>

            <div>
                <button onclick="startNewSession()">새 평가 세션 시작</button>
                <button onclick="syncMoodleData()">Moodle 데이터 동기화</button>
                <button onclick="loadUserHistory()">내 기록 보기</button>
            </div>
        </div>

        <div id="sessionFlow" class="card" style="display: none;">
            <h2>평가 프로세스</h2>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div id="flowContent"></div>
        </div>

        <div id="historyPanel" class="card" style="display: none;">
            <h2>평가 기록</h2>
            <div id="historyContent"></div>
        </div>
    </div>

    <script>
        let currentSession = null;
        let currentAssessment = null;
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let questionStartTime = 0;

        // Start new session
        async function startNewSession() {
            const userId = document.getElementById('userId').value;
            if (!userId) {
                alert('사용자 ID를 입력하세요');
                return;
            }

            try {
                // Create rest session
                const sessionRes = await fetch('/api/rest-sessions/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: parseInt(userId),
                        duration: 900 // 15 minutes
                    })
                });
                const sessionData = await sessionRes.json();
                currentSession = sessionData.session_id;

                // Start pre-rest assessment
                await startAssessment(userId, 'pre_rest', currentSession);
                updateProgress(25);

            } catch (error) {
                alert('오류가 발생했습니다: ' + error.message);
            }
        }

        // Start assessment
        async function startAssessment(userId, timing, sessionId) {
            try {
                // Create assessment
                const createRes = await fetch('/api/assessments/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: parseInt(userId),
                        type_id: 1,
                        timing: timing,
                        session_id: sessionId
                    })
                });
                const createData = await createRes.json();
                currentAssessment = createData.assessment_id;

                // Start assessment and get questions
                const startRes = await fetch(`/api/assessments/${currentAssessment}/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type_id: 1, question_count: 10 })
                });
                const startData = await startRes.json();
                currentQuestions = startData.questions;
                currentQuestionIndex = 0;

                // Show assessment UI
                showQuestion();

            } catch (error) {
                alert('평가 시작 오류: ' + error.message);
            }
        }

        // Show question
        function showQuestion() {
            if (currentQuestionIndex >= currentQuestions.length) {
                completeAssessment();
                return;
            }

            const question = currentQuestions[currentQuestionIndex];
            questionStartTime = Date.now();

            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('sessionFlow').style.display = 'block';

            let optionsHtml = '';
            if (question.options) {
                const options = JSON.parse(question.options);
                optionsHtml = options.map((opt, idx) =>
                    `<div class="option" onclick="selectAnswer('${opt}')">${opt}</div>`
                ).join('');
            } else {
                optionsHtml = `<input type="text" id="answerInput" placeholder="답변을 입력하세요" style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #e0e0e0;">
                              <button onclick="submitTextAnswer()" style="margin-top: 10px;">제출</button>`;
            }

            document.getElementById('flowContent').innerHTML = `
                <div class="question">
                    <h3>질문 ${currentQuestionIndex + 1} / ${currentQuestions.length}</h3>
                    <p style="font-size: 18px; margin: 20px 0;">${question.question_text}</p>
                    <div class="options">
                        ${optionsHtml}
                    </div>
                </div>
            `;

            updateProgress(25 + (currentQuestionIndex / currentQuestions.length) * 25);
        }

        // Select answer
        async function selectAnswer(answer) {
            const reactionTime = Date.now() - questionStartTime;
            const question = currentQuestions[currentQuestionIndex];

            try {
                await fetch(`/api/assessments/${currentAssessment}/respond`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question_id: question.id,
                        answer: answer,
                        reaction_time: reactionTime
                    })
                });

                currentQuestionIndex++;
                showQuestion();

            } catch (error) {
                alert('응답 제출 오류: ' + error.message);
            }
        }

        // Submit text answer
        function submitTextAnswer() {
            const answer = document.getElementById('answerInput').value;
            if (answer) {
                selectAnswer(answer);
            }
        }

        // Complete assessment
        async function completeAssessment() {
            try {
                const res = await fetch(`/api/assessments/${currentAssessment}/complete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();

                // Check if this was pre-rest or post-rest
                const assessmentRes = await fetch(`/api/assessments/${currentAssessment}`);
                const assessmentData = await assessmentRes.json();

                if (assessmentData.assessment.assessment_timing === 'pre_rest') {
                    // Show rest period
                    showRestPeriod();
                } else {
                    // Calculate and show results
                    showResults();
                }

            } catch (error) {
                alert('평가 완료 오류: ' + error.message);
            }
        }

        // Show rest period
        function showRestPeriod() {
            updateProgress(50);
            let remainingTime = 900; // 15 minutes

            document.getElementById('flowContent').innerHTML = `
                <div style="text-align: center; padding: 40px;">
                    <h3>휴식 시간</h3>
                    <p>지금부터 15분간 휴식을 취하세요.</p>
                    <div class="timer" id="timer">15:00</div>
                    <p style="color: #666;">휴식 후 두 번째 평가를 진행합니다.</p>
                    <button onclick="skipRest()">휴식 건너뛰기 (테스트용)</button>
                </div>
            `;

            const timerInterval = setInterval(() => {
                remainingTime--;
                const minutes = Math.floor(remainingTime / 60);
                const seconds = remainingTime % 60;
                document.getElementById('timer').textContent =
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                updateProgress(50 + (1 - remainingTime / 900) * 25);

                if (remainingTime <= 0) {
                    clearInterval(timerInterval);
                    endRestPeriod();
                }
            }, 1000);
        }

        // Skip rest (for testing)
        async function skipRest() {
            await endRestPeriod();
        }

        // End rest period
        async function endRestPeriod() {
            try {
                // Complete rest session
                await fetch(`/api/rest-sessions/${currentSession}/complete`, {
                    method: 'POST'
                });

                // Start post-rest assessment
                const userId = document.getElementById('userId').value;
                await startAssessment(userId, 'post_rest', currentSession);
                updateProgress(75);

            } catch (error) {
                alert('휴식 종료 오류: ' + error.message);
            }
        }

        // Show results
        async function showResults() {
            try {
                // Calculate recovery metrics
                const metricsRes = await fetch('/api/recovery-metrics/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: currentSession })
                });
                const metricsData = await metricsRes.json();
                const metrics = metricsData.metrics;

                updateProgress(100);

                document.getElementById('flowContent').innerHTML = `
                    <div class="results">
                        <h3>🎉 평가 완료!</h3>
                        <div class="result-item">
                            <span>회복 등급</span>
                            <span class="status ${metrics.recovery_category}">${getCategoryText(metrics.recovery_category)}</span>
                        </div>
                        <div class="result-item">
                            <span>전체 회복률</span>
                            <strong>${metrics.overall_recovery_score.toFixed(2)}%</strong>
                        </div>
                        <div class="result-item">
                            <span>정확도 회복률</span>
                            <strong>${metrics.accuracy_recovery_rate.toFixed(2)}%</strong>
                        </div>
                        <div class="result-item">
                            <span>반응 시간 개선</span>
                            <strong>${metrics.reaction_time_improvement}ms</strong>
                        </div>
                        <div class="result-item">
                            <span>일관성 점수</span>
                            <strong>${metrics.consistency_score.toFixed(2)}</strong>
                        </div>
                        <div class="result-item">
                            <span>휴식 효과성</span>
                            <strong>${metrics.rest_effectiveness.toFixed(2)}</strong>
                        </div>
                    </div>
                    <button onclick="resetDashboard()">대시보드로 돌아가기</button>
                `;

            } catch (error) {
                alert('결과 조회 오류: ' + error.message);
            }
        }

        // Get category text
        function getCategoryText(category) {
            const texts = {
                'excellent': '우수',
                'good': '양호',
                'moderate': '보통',
                'poor': '미흡',
                'declined': '저하'
            };
            return texts[category] || category;
        }

        // Update progress
        function updateProgress(percent) {
            document.getElementById('progressFill').style.width = percent + '%';
        }

        // Reset dashboard
        function resetDashboard() {
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('sessionFlow').style.display = 'none';
            updateProgress(0);
            currentSession = null;
            currentAssessment = null;
        }

        // Sync Moodle data
        async function syncMoodleData() {
            try {
                const usersRes = await fetch('/api/moodle/sync/users', { method: 'POST' });
                const coursesRes = await fetch('/api/moodle/sync/courses', { method: 'POST' });

                alert('Moodle 데이터 동기화 완료!');
            } catch (error) {
                alert('동기화 오류: ' + error.message);
            }
        }

        // Load user history
        async function loadUserHistory() {
            const userId = document.getElementById('userId').value;
            if (!userId) {
                alert('사용자 ID를 입력하세요');
                return;
            }

            try {
                const res = await fetch(`/api/users/${userId}/recovery-history`);
                const data = await res.json();

                let historyHtml = '<h3>평가 기록</h3>';
                if (data.history.length === 0) {
                    historyHtml += '<p>아직 평가 기록이 없습니다.</p>';
                } else {
                    historyHtml += data.history.map(h => `
                        <div class="result-item">
                            <div>
                                <strong>${new Date(h.calculated_at).toLocaleString('ko-KR')}</strong><br>
                                <span class="status ${h.recovery_category}">${getCategoryText(h.recovery_category)}</span>
                            </div>
                            <div style="text-align: right;">
                                회복률: ${h.overall_recovery_score.toFixed(1)}%
                            </div>
                        </div>
                    `).join('');

                    if (data.average) {
                        historyHtml += `
                            <div style="margin-top: 20px; padding: 20px; background: #f8f9fa; border-radius: 10px;">
                                <h4>평균 통계</h4>
                                <p>평균 회복률: ${data.average.avg_recovery?.toFixed(2) || 0}%</p>
                                <p>평균 효과성: ${data.average.avg_effectiveness?.toFixed(2) || 0}</p>
                                <p>전체 세션: ${data.average.total_sessions}</p>
                            </div>
                        `;
                    }
                }

                document.getElementById('historyContent').innerHTML = historyHtml;
                document.getElementById('historyPanel').style.display = 'block';

            } catch (error) {
                alert('기록 조회 오류: ' + error.message);
            }
        }
    </script>
</body>
</html>
