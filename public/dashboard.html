<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Concept System - Teacher Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 20px; }
        .concept-tag {
            display: inline-block;
            padding: 5px 10px;
            margin: 3px;
            background: #e3f2fd;
            border-radius: 15px;
            font-size: 0.9em;
        }
        .concept-tag.primary { background: #1976d2; color: white; }
        .concept-tag.ai-suggested { border: 2px dashed #ff9800; }
        .concept-tag.confirmed { background: #4caf50; color: white; }
        .confidence-score { font-size: 0.8em; color: #666; }
        #loading { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
            <a class="navbar-brand" href="#">LMS Concept System</a>
            <div class="ml-auto">
                <span id="username" class="navbar-text mr-3"></span>
                <button class="btn btn-sm btn-outline-secondary" onclick="logout()">Logout</button>
            </div>
        </nav>

        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Menu</h5>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item"><a href="#" onclick="showSection('concepts')">개념 관리</a></li>
                            <li class="list-group-item"><a href="#" onclick="showSection('problems')">문제 관리</a></li>
                            <li class="list-group-item"><a href="#" onclick="showSection('create-problem')">문제 생성</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <!-- Loading indicator -->
                <div id="loading" class="alert alert-info">Loading...</div>

                <!-- Concepts Section -->
                <div id="section-concepts" class="section" style="display:none;">
                    <h3>개념 관리</h3>
                    <div class="form-group">
                        <input type="text" class="form-control" id="concept-search" placeholder="개념 검색...">
                    </div>
                    <div id="concept-tree"></div>
                </div>

                <!-- Problems Section -->
                <div id="section-problems" class="section" style="display:none;">
                    <h3>문제 목록</h3>
                    <div class="form-group">
                        <select class="form-control" id="filter-subject">
                            <option value="">전체 과목</option>
                            <option value="mathematics">수학</option>
                            <option value="science">과학</option>
                        </select>
                    </div>
                    <div id="problems-list"></div>
                </div>

                <!-- Create Problem Section -->
                <div id="section-create-problem" class="section" style="display:none;">
                    <h3>문제 생성 및 개념 추천</h3>
                    <form id="create-problem-form">
                        <div class="form-group">
                            <label>문제 제목</label>
                            <input type="text" class="form-control" id="problem-title" required>
                        </div>
                        <div class="form-group">
                            <label>문제 내용</label>
                            <textarea class="form-control" id="problem-content" rows="5" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>과목</label>
                            <select class="form-control" id="problem-subject">
                                <option value="mathematics">수학</option>
                                <option value="science">과학</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>난이도</label>
                            <select class="form-control" id="problem-difficulty">
                                <option value="easy">쉬움</option>
                                <option value="medium">보통</option>
                                <option value="hard">어려움</option>
                            </select>
                        </div>
                        <button type="button" class="btn btn-primary" onclick="analyzeAndCreateProblem()">
                            AI 개념 추천받기
                        </button>
                    </form>

                    <div id="ai-suggestions" class="mt-4" style="display:none;">
                        <h4>AI 추천 개념</h4>
                        <p class="text-muted">아래 추천 개념을 검토하고 확인하세요.</p>
                        <div id="suggestions-list"></div>
                        <button class="btn btn-success mt-3" onclick="confirmAndSaveProblem()">
                            문제 저장
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/api';
        let authToken = '';
        let currentUser = null;
        let aiSuggestions = [];

        // Get token from URL or localStorage
        const urlParams = new URLSearchParams(window.location.search);
        authToken = urlParams.get('token') || localStorage.getItem('token') || '';

        if (authToken) {
            localStorage.setItem('token', authToken);
        }

        // Initialize
        $(document).ready(function() {
            if (!authToken) {
                alert('Please login first');
                window.location.href = '/';
                return;
            }

            loadCurrentUser();
            showSection('problems');
        });

        function loadCurrentUser() {
            $.ajax({
                url: API_BASE + '/auth/me',
                headers: { 'Authorization': 'Bearer ' + authToken },
                success: function(res) {
                    if (res.success) {
                        currentUser = res.data;
                        $('#username').text(currentUser.full_name);
                    }
                },
                error: function() {
                    alert('Authentication failed');
                    logout();
                }
            });
        }

        function showSection(section) {
            $('.section').hide();
            $('#section-' + section).show();

            if (section === 'concepts') {
                loadConcepts();
            } else if (section === 'problems') {
                loadProblems();
            }
        }

        function loadConcepts() {
            $('#loading').show();
            $.get(API_BASE + '/concepts?format=tree', function(res) {
                $('#loading').hide();
                if (res.success) {
                    renderConceptTree(res.data, $('#concept-tree'));
                }
            });
        }

        function renderConceptTree(concepts, container) {
            container.empty();
            const ul = $('<ul class="list-group">');

            concepts.forEach(concept => {
                const li = $('<li class="list-group-item">').text(concept.name);
                if (concept.children && concept.children.length > 0) {
                    const childContainer = $('<div class="ml-3">');
                    renderConceptTree(concept.children, childContainer);
                    li.append(childContainer);
                }
                ul.append(li);
            });

            container.append(ul);
        }

        function loadProblems() {
            $('#loading').show();
            const subject = $('#filter-subject').val();
            const url = subject ? API_BASE + '/problems?subject=' + subject : API_BASE + '/problems';

            $.get(url, function(res) {
                $('#loading').hide();
                if (res.success) {
                    renderProblems(res.data);
                }
            });
        }

        function renderProblems(problems) {
            const container = $('#problems-list');
            container.empty();

            problems.forEach(problem => {
                const card = $('<div class="card mb-3">');
                const body = $('<div class="card-body">');

                body.append('<h5>' + problem.title + '</h5>');
                body.append('<p class="text-muted">' + problem.content.substring(0, 100) + '...</p>');

                const conceptsDiv = $('<div class="mb-2">');
                problem.concepts.forEach(concept => {
                    let classes = 'concept-tag';
                    if (concept.is_primary) classes += ' primary';
                    if (concept.is_ai_suggested && !concept.confirmed) classes += ' ai-suggested';
                    if (concept.confirmed) classes += ' confirmed';

                    const tag = $('<span class="' + classes + '">')
                        .text(concept.name + ' (' + (concept.confidence_score * 100).toFixed(0) + '%)');
                    conceptsDiv.append(tag);
                });
                body.append(conceptsDiv);

                body.append('<small class="text-muted">난이도: ' + problem.difficulty + '</small>');
                card.append(body);
                container.append(card);
            });
        }

        function analyzeAndCreateProblem() {
            const content = $('#problem-title').val() + ' ' + $('#problem-content').val();
            const subject = $('#problem-subject').val();

            $('#loading').show();

            $.ajax({
                url: API_BASE + '/ai/analyze',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ content, subject }),
                success: function(res) {
                    $('#loading').hide();
                    if (res.success) {
                        aiSuggestions = res.data.suggestions;
                        renderSuggestions(aiSuggestions);
                        $('#ai-suggestions').show();
                    }
                },
                error: function() {
                    $('#loading').hide();
                    alert('AI 분석 실패');
                }
            });
        }

        function renderSuggestions(suggestions) {
            const container = $('#suggestions-list');
            container.empty();

            suggestions.forEach((sug, index) => {
                const card = $('<div class="card mb-2">');
                const body = $('<div class="card-body">');

                body.append('<h6>' + sug.concept_name + '</h6>');
                body.append('<p class="text-muted mb-1">' + sug.concept_path + '</p>');
                body.append('<div class="confidence-score">신뢰도: ' + (sug.confidence * 100).toFixed(0) + '%</div>');

                const checkbox = $('<input type="checkbox" checked>').attr('data-index', index);
                body.prepend(checkbox);

                card.append(body);
                container.append(card);
            });
        }

        function confirmAndSaveProblem() {
            const selectedSuggestions = [];
            $('#suggestions-list input:checked').each(function() {
                const index = $(this).data('index');
                selectedSuggestions.push(aiSuggestions[index]);
            });

            const problemData = {
                title: $('#problem-title').val(),
                content: $('#problem-content').val(),
                subject: $('#problem-subject').val(),
                difficulty: $('#problem-difficulty').val(),
                created_by: currentUser.id,
                concepts: selectedSuggestions.map(sug => ({
                    concept_id: sug.concept_id,
                    is_primary: false,
                    confidence_score: sug.confidence,
                    is_ai_suggested: true,
                    confirmed_by_teacher: true
                }))
            };

            $('#loading').show();

            $.ajax({
                url: API_BASE + '/problems',
                method: 'POST',
                contentType: 'application/json',
                headers: { 'Authorization': 'Bearer ' + authToken },
                data: JSON.stringify(problemData),
                success: function(res) {
                    $('#loading').hide();
                    if (res.success) {
                        alert('문제가 저장되었습니다!');
                        $('#create-problem-form')[0].reset();
                        $('#ai-suggestions').hide();
                        showSection('problems');
                    }
                },
                error: function() {
                    $('#loading').hide();
                    alert('문제 저장 실패');
                }
            });
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/';
        }

        $('#filter-subject').change(loadProblems);
    </script>
</body>
</html>
