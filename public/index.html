<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Tree - Moodle Integration</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/smartphone.css">
    <link rel="stylesheet" href="/css/concept-tree.css">
</head>
<body>
    <!-- Main Content Area -->
    <div class="main-content">
        <header>
            <h1>🌳 Concept Tree Visualization</h1>
            <p>Moodle LMS 통합 수학 학습 앱</p>
        </header>

        <div class="demo-controls">
            <h2>데모 컨트롤</h2>
            <div class="control-group">
                <label for="problem-select">문제 선택:</label>
                <select id="problem-select">
                    <option value="1">문제 1: 2 + 4는?</option>
                    <option value="2">문제 2: 7은 소수인가?</option>
                    <option value="3">문제 3: 6의 모든 약수는?</option>
                </select>
                <button onclick="loadProblem()" class="btn-primary">문제 불러오기</button>
            </div>

            <div class="control-group">
                <label for="number-input">숫자 직접 입력:</label>
                <input type="number" id="number-input" min="1" max="100" placeholder="1-100">
                <button onclick="showConceptTreeByNumber()" class="btn-primary">개념 트리 보기</button>
            </div>

            <div id="status-message" class="status-message"></div>
        </div>

        <div class="info-panel">
            <h3>ℹ️ 사용 방법</h3>
            <ol>
                <li>위 드롭다운에서 문제를 선택하거나 숫자를 직접 입력하세요</li>
                <li>우측 하단 가상 스마트폰에서 숫자를 클릭하세요</li>
                <li>클릭한 숫자와 관련된 개념들이 나무 뿌리처럼 뻗어나갑니다</li>
                <li>각 개념 노드를 클릭하면 하위 개념을 볼 수 있습니다</li>
            </ol>
        </div>
    </div>

    <!-- Virtual Smartphone Container (Bottom Right) -->
    <div class="smartphone-container" id="smartphone">
        <div class="smartphone-frame">
            <!-- Phone bezel and notch -->
            <div class="phone-notch"></div>

            <!-- Phone screen -->
            <div class="phone-screen">
                <div class="screen-header">
                    <span class="app-title">개념 트리</span>
                    <span class="time" id="current-time">00:00</span>
                </div>

                <!-- Problem Display -->
                <div class="problem-display" id="problem-display">
                    <h3 id="problem-title">문제를 선택하세요</h3>
                    <div id="problem-content" class="problem-content">
                        <p>숫자를 클릭하면 관련 개념이 나타납니다</p>
                    </div>
                    <div id="problem-numbers" class="problem-numbers">
                        <!-- Clickable numbers will be inserted here -->
                    </div>
                </div>

                <!-- Concept Tree Visualization -->
                <div class="concept-tree-container" id="concept-tree-container">
                    <div class="tree-canvas" id="tree-canvas">
                        <svg id="tree-svg" width="100%" height="100%">
                            <defs>
                                <filter id="glow">
                                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                                    <feMerge>
                                        <feMergeNode in="coloredBlur"/>
                                        <feMergeNode in="SourceGraphic"/>
                                    </feMerge>
                                </filter>
                            </defs>
                        </svg>
                    </div>
                    <button class="close-tree-btn" onclick="closeConceptTree()">✕</button>
                </div>

                <div class="screen-footer">
                    <div class="nav-buttons">
                        <button class="nav-btn">◀</button>
                        <button class="nav-btn">⬤</button>
                        <button class="nav-btn">▮▮</button>
                    </div>
                </div>
            </div>

            <!-- Phone buttons -->
            <div class="phone-button phone-button-power"></div>
            <div class="phone-button phone-button-volume-up"></div>
            <div class="phone-button phone-button-volume-down"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/concept-tree.js"></script>
    <script src="/js/app.js"></script>

    <script>
        // Update clock every second
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('current-time').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
