<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Wave - 함수 변화 시각화</title>
    <link rel="stylesheet" href="css/smartphone.css">
</head>
<body>
    <div class="container">
        <!-- 메인 컨텐츠 영역 -->
        <div class="main-content">
            <header>
                <h1>Change Wave</h1>
                <p class="subtitle">함수의 변화를 파동으로 경험하세요</p>
            </header>

            <div class="info-panel">
                <h2 id="problem-title">문제를 불러오는 중...</h2>
                <p id="problem-description">Moodle에서 문제 정보를 가져오고 있습니다.</p>
            </div>

            <div class="controls">
                <button id="btn-play" class="btn btn-primary">▶ 재생</button>
                <button id="btn-pause" class="btn btn-secondary">⏸ 일시정지</button>
                <button id="btn-reset" class="btn btn-secondary">↻ 리셋</button>
                <div class="speed-control">
                    <label for="speed">속도:</label>
                    <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1">
                    <span id="speed-value">1.0x</span>
                </div>
            </div>
        </div>

        <!-- 우측 하단 가상 스마트폰 화면 -->
        <div class="smartphone-frame">
            <div class="smartphone-screen">
                <div class="status-bar">
                    <span class="time" id="current-time">12:00</span>
                    <span class="battery">🔋</span>
                </div>

                <div class="app-content">
                    <h3 class="app-title">Change Wave</h3>

                    <!-- Canvas for Change Wave visualization -->
                    <canvas id="waveCanvas" width="300" height="400"></canvas>

                    <div class="function-info">
                        <p><strong>함수:</strong> <span id="function-expr">f(x) = x²</span></p>
                        <p><strong>현재 x:</strong> <span id="current-x">0</span></p>
                        <p><strong>현재 f(x):</strong> <span id="current-y">0</span></p>
                        <p><strong>변화율:</strong> <span id="derivative">0</span></p>
                    </div>
                </div>

                <div class="home-indicator"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/changewave.js"></script>
    <script>
        // 현재 시간 업데이트
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('current-time').textContent = `${hours}:${minutes}`;
        }
        updateTime();
        setInterval(updateTime, 60000);

        // 앱 초기화
        window.addEventListener('DOMContentLoaded', () => {
            initChangeWave();
            loadProblemFromMoodle();
        });
    </script>
</body>
</html>
