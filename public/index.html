<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>ALT42 Choice Gesture - KAIST Touch Math Academy</title>
    <meta name="description" content="Interactive multiple choice questions with animated hand gestures">
    <meta name="author" content="KAIST Touch Math Academy">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👆</text></svg>">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Virtual Smartphone Display -->
    <div class="smartphone-container">
        <div class="smartphone-frame">
            <div class="screen-content">
                <!-- App Header -->
                <div class="app-header">
                    <h1>Choice Gesture</h1>
                    <p>KAIST Touch Math Academy</p>
                </div>

                <!-- Question Container -->
                <div class="question-container" id="questionContainer">
                    <!-- Loading State -->
                    <div class="loading" id="loadingSpinner">
                        <div class="spinner"></div>
                    </div>

                    <!-- Question Box (will be populated by JavaScript) -->
                    <div class="question-box" id="questionBox" style="display: none;">
                        <div class="question-text" id="questionText"></div>
                        <div class="question-meta" id="questionMeta"></div>
                    </div>

                    <!-- Choices Container (will be populated by JavaScript) -->
                    <div class="choices-container" id="choicesContainer"></div>

                    <!-- Feedback Message -->
                    <div class="feedback-message" id="feedbackMessage">
                        <div class="feedback-icon" id="feedbackIcon"></div>
                        <div class="feedback-title" id="feedbackTitle"></div>
                        <div class="feedback-text" id="feedbackText"></div>
                    </div>
                </div>

                <!-- Button Container -->
                <div class="button-container">
                    <button class="btn btn-secondary" id="btnSubmit" disabled>정답 확인</button>
                    <button class="btn btn-primary" id="btnNext">다음 문제</button>
                </div>
            </div>

            <!-- Hand Gesture Overlay -->
            <div class="hand-gesture" id="handGesture">
                <div class="hand-icon">👆</div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
