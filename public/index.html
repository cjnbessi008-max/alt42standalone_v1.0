<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Light - 도형 학습 앱</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/smartphone.css">
    <link rel="stylesheet" href="css/focus-light.css">
</head>
<body>
    <!-- 메인 컨텐츠 영역 -->
    <div class="main-container">
        <header class="header">
            <h1>Focus Light 도형 학습 시스템</h1>
            <p class="subtitle">도형의 핵심 조건을 밝게 강조하여 학습 효과를 높입니다</p>
        </header>

        <!-- 문제 선택 패널 -->
        <div class="control-panel">
            <h2>문제 선택</h2>
            <div id="problem-list" class="problem-list">
                <div class="loading">문제를 불러오는 중...</div>
            </div>

            <div class="controls">
                <h3>Focus Light 설정</h3>
                <div class="control-group">
                    <label for="intensity-slider">강도:</label>
                    <input type="range" id="intensity-slider" min="1" max="5" value="3" step="1">
                    <span id="intensity-value">3</span>
                </div>
                <div class="control-group">
                    <label for="animation-select">애니메이션:</label>
                    <select id="animation-select">
                        <option value="glow">Glow (부드러운 빛)</option>
                        <option value="pulse">Pulse (맥박)</option>
                        <option value="flash">Flash (깜빡임)</option>
                        <option value="static">Static (정적)</option>
                    </select>
                </div>
                <div class="control-group">
                    <button id="toggle-focus-btn" class="btn-primary">Focus Light ON/OFF</button>
                </div>
            </div>

            <!-- 현재 문제 정보 -->
            <div id="problem-info" class="problem-info" style="display: none;">
                <h3>현재 문제</h3>
                <div id="problem-details"></div>
            </div>
        </div>
    </div>

    <!-- 우측 하단 가상 스마트폰 화면 -->
    <div class="smartphone-container">
        <div class="smartphone">
            <!-- 스마트폰 상단바 -->
            <div class="smartphone-notch">
                <div class="notch-speaker"></div>
            </div>

            <!-- 스마트폰 화면 -->
            <div class="smartphone-screen">
                <div class="app-header">
                    <div class="app-title">도형 학습</div>
                    <div class="app-time" id="current-time">12:00</div>
                </div>

                <!-- 문제 표시 영역 -->
                <div class="problem-content">
                    <h2 id="problem-title">문제를 선택하세요</h2>
                    <p id="problem-description"></p>

                    <!-- SVG 도형 표시 영역 -->
                    <div class="shape-container">
                        <svg id="shape-canvas" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                            <!-- 도형이 여기에 동적으로 렌더링됩니다 -->
                        </svg>
                    </div>

                    <!-- Focus 요소 라벨 표시 영역 -->
                    <div id="focus-labels" class="focus-labels"></div>
                </div>

                <!-- 앱 하단 네비게이션 -->
                <div class="app-footer">
                    <button class="nav-btn active">
                        <span class="nav-icon">📐</span>
                        <span class="nav-text">학습</span>
                    </button>
                    <button class="nav-btn">
                        <span class="nav-icon">📊</span>
                        <span class="nav-text">진도</span>
                    </button>
                    <button class="nav-btn">
                        <span class="nav-icon">⚙️</span>
                        <span class="nav-text">설정</span>
                    </button>
                </div>
            </div>

            <!-- 스마트폰 홈 버튼 -->
            <div class="smartphone-home-btn"></div>
        </div>

        <!-- 최소화/최대화 버튼 -->
        <button class="smartphone-toggle" id="smartphone-toggle" title="최소화/최대화">
            <span>📱</span>
        </button>
    </div>

    <!-- JavaScript -->
    <script src="js/app.js"></script>
    <script src="js/shape-renderer.js"></script>
    <script src="js/focus-light.js"></script>
</body>
</html>
