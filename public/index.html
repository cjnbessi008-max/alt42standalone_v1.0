<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Alt42 - AI 기반 학습 활동 모니터">
    <meta name="theme-color" content="#667eea">

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">

    <title>Alt42 - Learning Activity Monitor</title>

    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/css/pwa.css">
</head>
<body>
    <!-- 로딩 화면 -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Alt42 로딩 중...</p>
    </div>

    <!-- 앱 컨테이너 -->
    <div id="app" class="app" style="display: none;">
        <!-- 헤더 -->
        <header class="app-header">
            <div class="header-left">
                <h1>Alt42</h1>
                <span class="header-subtitle">Learning Monitor</span>
            </div>
            <div class="header-right">
                <button id="notif-btn" class="icon-btn" title="알림">
                    <span class="notif-badge" style="display: none;">3</span>
                    🔔
                </button>
                <button id="user-menu-btn" class="icon-btn" title="사용자 메뉴">
                    👤
                </button>
            </div>
        </header>

        <!-- 메인 컨텐츠 -->
        <main class="main-content">
            <!-- 로그인 화면 -->
            <div id="login-view" class="view">
                <div class="login-container">
                    <h2>Alt42 로그인</h2>
                    <form id="login-form">
                        <div class="form-group">
                            <label>이메일</label>
                            <input type="email" id="login-email" required placeholder="your@email.com">
                        </div>
                        <div class="form-group">
                            <label>비밀번호</label>
                            <input type="password" id="login-password" required placeholder="비밀번호">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">로그인</button>
                    </form>
                    <p class="text-center mt-3">
                        계정이 없으신가요? <a href="#" id="show-register">회원가입</a>
                    </p>
                </div>
            </div>

            <!-- 회원가입 화면 -->
            <div id="register-view" class="view" style="display: none;">
                <div class="login-container">
                    <h2>회원가입</h2>
                    <form id="register-form">
                        <div class="form-group">
                            <label>사용자명</label>
                            <input type="text" id="register-username" required placeholder="홍길동">
                        </div>
                        <div class="form-group">
                            <label>이메일</label>
                            <input type="email" id="register-email" required placeholder="your@email.com">
                        </div>
                        <div class="form-group">
                            <label>비밀번호</label>
                            <input type="password" id="register-password" required placeholder="비밀번호">
                        </div>
                        <div class="form-group">
                            <label>역할</label>
                            <select id="register-role">
                                <option value="student">학생</option>
                                <option value="teacher">교사</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">가입하기</button>
                    </form>
                    <p class="text-center mt-3">
                        이미 계정이 있으신가요? <a href="#" id="show-login">로그인</a>
                    </p>
                </div>
            </div>

            <!-- 대시보드 화면 -->
            <div id="dashboard-view" class="view" style="display: none;">
                <div class="container">
                    <!-- 통계 카드 -->
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon">📊</div>
                            <div class="stat-content">
                                <h3>활동 수</h3>
                                <p id="stat-activities" class="stat-value">0</p>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">✅</div>
                            <div class="stat-content">
                                <h3>정확도</h3>
                                <p id="stat-accuracy" class="stat-value">0%</p>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">🏆</div>
                            <div class="stat-content">
                                <h3>레벨</h3>
                                <p id="stat-level" class="stat-value">1</p>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">📈</div>
                            <div class="stat-content">
                                <h3>평균 점수</h3>
                                <p id="stat-score" class="stat-value">0</p>
                            </div>
                        </div>
                    </div>

                    <!-- 추천 문제 섹션 -->
                    <div class="section">
                        <h2>추천 문제</h2>
                        <div id="recommended-problems" class="problem-grid">
                            <!-- 동적으로 추가 -->
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- 우측 하단 스마트폰 -->
        <div class="smartphone-container">
            <div class="smartphone">
                <div class="smartphone-notch"></div>
                <div class="smartphone-screen">
                    <div class="screen-header">
                        <div class="time" id="phone-time">10:30</div>
                        <div class="status-icons">
                            <span class="signal">📶</span>
                            <span class="battery">🔋</span>
                        </div>
                    </div>

                    <div class="app-header">
                        <h2>실시간 로그</h2>
                        <button id="clear-logs-btn" class="clear-btn">지우기</button>
                    </div>

                    <div class="log-container" id="log-container">
                        <div class="log-list" id="log-list">
                            <!-- Slow Climb 로그 -->
                        </div>
                    </div>

                    <div class="screen-footer">
                        <div class="home-indicator"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 하단 네비게이션 -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-view="dashboard">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">홈</span>
            </button>
            <button class="nav-btn" data-view="problems">
                <span class="nav-icon">📝</span>
                <span class="nav-label">문제</span>
            </button>
            <button class="nav-btn" data-view="stats">
                <span class="nav-icon">📊</span>
                <span class="nav-label">통계</span>
            </button>
            <button class="nav-btn" data-view="settings">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">설정</span>
            </button>
        </nav>
    </div>

    <!-- 오프라인 알림 -->
    <div id="offline-notification" class="notification" style="display: none;">
        <span>⚠️ 오프라인 모드입니다</span>
    </div>

    <!-- 업데이트 알림 -->
    <div id="update-notification" class="notification" style="display: none;">
        <span>🔄 새 버전이 있습니다</span>
        <button id="update-btn">업데이트</button>
    </div>

    <!-- Scripts -->
    <script src="/assets/js/slow-climb.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pwa.js"></script>
</body>
</html>
