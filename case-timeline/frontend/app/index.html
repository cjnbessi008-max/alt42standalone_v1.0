<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Timeline - Virtual Smartphone</title>
    <link rel="stylesheet" href="../css/smartphone.css">
    <link rel="stylesheet" href="../css/timeline.css">
</head>
<body>
    <!-- Main container with smartphone positioned at bottom right -->
    <div class="main-container">
        <!-- Virtual Smartphone Frame -->
        <div class="smartphone-frame">
            <!-- Phone header with status bar -->
            <div class="phone-header">
                <div class="status-bar">
                    <span class="time" id="current-time">09:00</span>
                    <div class="status-icons">
                        <span class="signal">📶</span>
                        <span class="battery">🔋</span>
                    </div>
                </div>
            </div>

            <!-- Phone screen content -->
            <div class="phone-screen">
                <!-- App header -->
                <div class="app-header">
                    <button class="btn-back" onclick="goBack()">◀</button>
                    <h1 class="app-title" id="case-title">Case Timeline</h1>
                    <div class="score-display" id="score-display">
                        <span class="score">0</span>/<span class="max-score">0</span>
                    </div>
                </div>

                <!-- Loading screen -->
                <div id="loading-screen" class="loading-screen">
                    <div class="spinner"></div>
                    <p>Loading case...</p>
                </div>

                <!-- Timeline container -->
                <div id="timeline-container" class="timeline-container" style="display: none;">
                    <!-- Progress indicator -->
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
                        <span class="progress-text" id="progress-text">0 / 0</span>
                    </div>

                    <!-- Timeline events will be dynamically loaded here -->
                    <div id="timeline-events" class="timeline-events">
                        <!-- Events will be added dynamically via JavaScript -->
                    </div>
                </div>

                <!-- Event detail modal -->
                <div id="event-modal" class="event-modal" style="display: none;">
                    <div class="modal-content">
                        <div class="modal-header">
                            <span class="event-time" id="modal-event-time"></span>
                            <button class="btn-close" onclick="closeEventModal()">×</button>
                        </div>
                        <div class="modal-body">
                            <h2 id="modal-event-title"></h2>
                            <div class="event-type-badge" id="modal-event-type"></div>
                            <div class="event-content" id="modal-event-content"></div>

                            <!-- Media display -->
                            <div id="modal-event-media" class="event-media"></div>

                            <!-- Interactive response section -->
                            <div id="modal-response-section" class="response-section" style="display: none;">
                                <textarea id="user-response" class="response-input" placeholder="Enter your answer here..." rows="3"></textarea>
                                <button class="btn-submit" onclick="submitResponse()">Submit Answer</button>
                                <div id="feedback-message" class="feedback-message"></div>
                            </div>

                            <!-- Continue button -->
                            <button class="btn-continue" id="btn-continue" onclick="continueToNext()" style="display: none;">
                                Continue →
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Completion screen -->
                <div id="completion-screen" class="completion-screen" style="display: none;">
                    <div class="completion-content">
                        <div class="completion-icon">🎉</div>
                        <h2>Case Completed!</h2>
                        <div class="final-score">
                            <p>Your Score:</p>
                            <p class="score-large"><span id="final-score">0</span> / <span id="final-max-score">0</span></p>
                            <p class="score-percentage" id="score-percentage">0%</p>
                        </div>
                        <button class="btn-restart" onclick="restartCase()">Review Case</button>
                    </div>
                </div>
            </div>

            <!-- Phone home button -->
            <div class="phone-footer">
                <div class="home-button"></div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="../js/config.js"></script>
    <script src="../js/timeline.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
