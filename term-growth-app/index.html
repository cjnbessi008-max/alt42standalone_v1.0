<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Term Growth - 함수 항 성장 학습</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@12.2.0/lib/browser/math.min.js"></script>
</head>
<body>
    <!-- Main Container -->
    <div class="main-container">
        <!-- Left Side: Control Panel (Teacher/Admin View) -->
        <div class="control-panel">
            <div class="panel-header">
                <h1>📊 Term Growth 학습 시스템</h1>
                <p class="subtitle">함수의 항이 추가되며 그래프가 성장합니다</p>
            </div>

            <div class="panel-content">
                <!-- Problem Information -->
                <div class="section">
                    <h2>📝 문제 정보</h2>
                    <div class="info-box">
                        <p><strong>문제 ID:</strong> <span id="problemId">TG-001</span></p>
                        <p><strong>난이도:</strong> <span id="difficulty">중급</span></p>
                        <p><strong>목표:</strong> <span id="objective">2차 다항식 이해하기</span></p>
                    </div>
                </div>

                <!-- Term Controls -->
                <div class="section">
                    <h2>🎯 항 추가 제어</h2>
                    <div class="term-list" id="termList">
                        <!-- Terms will be dynamically added here -->
                    </div>
                    <div class="controls">
                        <button id="nextTermBtn" class="btn btn-primary">다음 항 추가</button>
                        <button id="resetBtn" class="btn btn-secondary">초기화</button>
                        <button id="autoPlayBtn" class="btn btn-success">자동 재생</button>
                    </div>
                </div>

                <!-- Current Function Display -->
                <div class="section">
                    <h2>📐 현재 함수</h2>
                    <div class="function-display" id="currentFunction">
                        f(x) = 0
                    </div>
                </div>

                <!-- Progress Tracking -->
                <div class="section">
                    <h2>📈 학습 진행도</h2>
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                        </div>
                        <p class="progress-text"><span id="currentStep">0</span> / <span id="totalSteps">0</span> 단계</p>
                    </div>
                </div>

                <!-- Moodle Integration Status -->
                <div class="section">
                    <h2>🔗 LMS 연동 상태</h2>
                    <div class="status-box">
                        <span class="status-indicator" id="moodleStatus">●</span>
                        <span id="moodleStatusText">Moodle 연결 대기 중...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side: Virtual Smartphone Screen -->
        <div class="smartphone-container">
            <div class="smartphone">
                <div class="smartphone-header">
                    <div class="notch"></div>
                    <div class="speaker"></div>
                </div>

                <div class="smartphone-screen">
                    <div class="app-header">
                        <h3>Term Growth</h3>
                        <span class="app-subtitle">함수 학습</span>
                    </div>

                    <div class="graph-container">
                        <canvas id="termGrowthChart"></canvas>
                    </div>

                    <div class="term-info">
                        <div class="current-term" id="currentTermDisplay">
                            <span class="label">추가된 항:</span>
                            <span class="value" id="currentTermValue">시작 준비</span>
                        </div>
                        <div class="term-explanation" id="termExplanation">
                            시작 버튼을 눌러 학습을 시작하세요.
                        </div>
                    </div>

                    <div class="student-interaction">
                        <button class="student-btn" id="studentNextBtn">다음 단계</button>
                    </div>
                </div>

                <div class="smartphone-footer">
                    <div class="home-indicator"></div>
                </div>
            </div>
            <p class="device-label">학생용 앱 화면</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/moodle-integration.js"></script>
    <script src="js/term-growth.js"></script>
</body>
</html>
