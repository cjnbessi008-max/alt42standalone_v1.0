<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a90e2">
    <meta name="description" content="AI 기반 맞춤 학습 추천 시스템">
    <title>AI 학습 추천 - Curvy Log</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Curvy Log">

    <link rel="stylesheet" href="css/style.css">
    <style>
        .recommendations-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header-section h1 {
            margin: 0 0 10px 0;
            font-size: 2.5em;
        }

        .header-section p {
            margin: 0;
            opacity: 0.9;
            font-size: 1.1em;
        }

        .insights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .insight-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-left: 4px solid;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .insight-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .insight-card.improving {
            border-color: #50c878;
        }

        .insight-card.declining {
            border-color: #ff6b6b;
        }

        .insight-card.stable {
            border-color: #4a90e2;
        }

        .insight-card h3 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 1.1em;
        }

        .insight-value {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .insight-label {
            color: #666;
            font-size: 0.9em;
        }

        .recommendations-list {
            display: grid;
            gap: 20px;
        }

        .recommendation-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            border-left: 6px solid;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .recommendation-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .recommendation-card:hover {
            transform: translateX(5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .recommendation-card.high {
            border-color: #ff6b6b;
        }

        .recommendation-card.medium {
            border-color: #ffa500;
        }

        .recommendation-card.low {
            border-color: #50c878;
        }

        .recommendation-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .recommendation-icon {
            font-size: 3em;
            flex-shrink: 0;
        }

        .recommendation-title {
            flex: 1;
        }

        .recommendation-title h2 {
            margin: 0 0 5px 0;
            color: #333;
            font-size: 1.5em;
        }

        .priority-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .priority-badge.high {
            background: #ffe0e0;
            color: #ff6b6b;
        }

        .priority-badge.medium {
            background: #fff4e0;
            color: #ffa500;
        }

        .priority-badge.low {
            background: #e0ffe0;
            color: #50c878;
        }

        .recommendation-description {
            color: #555;
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 1.05em;
        }

        .suggested-content {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .suggested-content h4 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: 1.1em;
        }

        .content-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .content-list li {
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .content-list li:last-child {
            border-bottom: none;
        }

        .content-list li::before {
            content: '✓';
            display: inline-block;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .confidence-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 15px;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.9em;
        }

        .action-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .action-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .action-btn.secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .action-btn.secondary:hover {
            background: #667eea;
            color: white;
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .nav-tab {
            padding: 15px 30px;
            border: none;
            background: none;
            color: #666;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .nav-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .nav-tab:hover {
            color: #667eea;
        }

        @media (max-width: 768px) {
            .header-section h1 {
                font-size: 2em;
            }

            .insights-grid {
                grid-template-columns: 1fr;
            }

            .recommendation-header {
                flex-direction: column;
                text-align: center;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="recommendations-container">
        <div class="header-section">
            <h1>🤖 AI 학습 추천</h1>
            <p>당신의 학습 패턴을 분석하여 맞춤형 학습 경로를 제안합니다</p>
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active" data-tab="recommendations">추천 목록</button>
            <button class="nav-tab" data-tab="insights">학습 인사이트</button>
            <button class="nav-tab" data-tab="settings">설정</button>
        </div>

        <!-- Insights Section -->
        <div id="insights-section" class="insights-grid" style="display: none;">
            <div class="insight-card improving">
                <h3>학습 추세</h3>
                <div class="insight-value" id="trendValue">--</div>
                <div class="insight-label">지난 30일 변화율</div>
            </div>

            <div class="insight-card stable">
                <h3>일관성 점수</h3>
                <div class="insight-value" id="consistencyValue">--</div>
                <div class="insight-label">학습 규칙성</div>
            </div>

            <div class="insight-card improving">
                <h3>평균 성적</h3>
                <div class="insight-value" id="averageScore">--</div>
                <div class="insight-label">전체 평균</div>
            </div>

            <div class="insight-card stable">
                <h3>학습 활동</h3>
                <div class="insight-value" id="totalActivities">--</div>
                <div class="insight-label">총 학습 횟수</div>
            </div>
        </div>

        <!-- Recommendations Section -->
        <div id="recommendations-section">
            <div class="loading-state" id="loadingState">
                <div class="loading-spinner"></div>
                <p>AI가 당신의 학습 패턴을 분석하고 있습니다...</p>
            </div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-state-icon">📊</div>
                <h3>추천을 생성하려면 학습 데이터가 필요합니다</h3>
                <p>먼저 학습 활동을 진행하거나 데모 데이터를 로드해주세요.</p>
                <button class="action-btn primary" onclick="window.location.href='demo.html'">데모 시작하기</button>
            </div>

            <div class="recommendations-list" id="recommendationsList"></div>
        </div>

        <!-- Settings Section -->
        <div id="settings-section" style="display: none;">
            <div class="insight-card">
                <h3>추천 설정</h3>
                <div style="margin-top: 20px;">
                    <label style="display: block; margin-bottom: 10px;">
                        <input type="checkbox" id="enableNotifications" checked>
                        추천 알림 받기
                    </label>
                    <label style="display: block; margin-bottom: 10px;">
                        <input type="checkbox" id="autoUpdate" checked>
                        자동 업데이트
                    </label>
                    <label style="display: block; margin-bottom: 20px;">
                        최대 추천 개수:
                        <input type="number" id="maxRecommendations" min="1" max="10" value="5" style="margin-left: 10px; padding: 5px;">
                    </label>
                    <button class="action-btn primary" onclick="saveSettings()">설정 저장</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/recommendation-engine.js"></script>
    <script>
        let recommendationEngine = null;
        let currentRecommendations = null;
        let currentInsights = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            setupTabs();
            await loadRecommendations();

            // Register service worker
            if ('serviceWorker' in navigator) {
                try {
                    await navigator.serviceWorker.register('/service-worker.js');
                    console.log('Service Worker registered');
                } catch (error) {
                    console.error('Service Worker registration failed:', error);
                }
            }
        });

        function setupTabs() {
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');

                    const tabName = this.dataset.tab;
                    document.getElementById('recommendations-section').style.display =
                        tabName === 'recommendations' ? 'block' : 'none';
                    document.getElementById('insights-section').style.display =
                        tabName === 'insights' ? 'grid' : 'none';
                    document.getElementById('settings-section').style.display =
                        tabName === 'settings' ? 'block' : 'none';
                });
            });
        }

        async function loadRecommendations() {
            const loadingState = document.getElementById('loadingState');
            const emptyState = document.getElementById('emptyState');
            const recommendationsList = document.getElementById('recommendationsList');

            loadingState.style.display = 'block';
            emptyState.style.display = 'none';
            recommendationsList.innerHTML = '';

            try {
                // Try to load real data from localStorage or API
                let userData = loadUserData();

                if (!userData || userData.length < 5) {
                    // Generate demo data
                    userData = generateDemoData();
                }

                // Generate recommendations
                recommendationEngine = new RecommendationEngine({
                    minDataPoints: 5,
                    confidenceThreshold: 0.6,
                    maxRecommendations: 5
                });

                const result = await recommendationEngine.generateRecommendations(userData);

                loadingState.style.display = 'none';

                if (result.success && result.recommendations.length > 0) {
                    currentRecommendations = result.recommendations;
                    currentInsights = result.insights;

                    displayRecommendations(result.recommendations);
                    displayInsights(result.insights);
                } else {
                    emptyState.style.display = 'block';
                }

            } catch (error) {
                console.error('Failed to load recommendations:', error);
                loadingState.style.display = 'none';
                emptyState.style.display = 'block';
            }
        }

        function loadUserData() {
            const stored = localStorage.getItem('curvyLogUserData');
            return stored ? JSON.parse(stored) : null;
        }

        function generateDemoData() {
            const data = [];
            const now = Date.now() / 1000;

            for (let i = 0; i < 30; i++) {
                const daysAgo = 30 - i;
                const baseScore = 60 + (i / 30) * 20 + Math.random() * 15;

                data.push({
                    x: i,
                    y: Math.log(baseScore + 1),
                    rawScore: baseScore,
                    timestamp: now - (daysAgo * 86400),
                    event: `학습 활동 ${i + 1}`,
                    quizName: ['기초', '중급', '고급'][Math.floor(i / 10)],
                    attempt: (i % 3) + 1,
                    timeTaken: 1200 + Math.random() * 1200
                });
            }

            // Save to localStorage
            localStorage.setItem('curvyLogUserData', JSON.stringify(data));

            return data;
        }

        function displayRecommendations(recommendations) {
            const list = document.getElementById('recommendationsList');
            list.innerHTML = '';

            recommendations.forEach((rec, index) => {
                const card = createRecommendationCard(rec, index);
                list.appendChild(card);

                // Animate in
                setTimeout(() => {
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(20px)';
                    requestAnimationFrame(() => {
                        card.style.transition = 'all 0.5s ease';
                        card.style.opacity = '1';
                        card.style.transform = 'translateY(0)';
                    });
                }, index * 100);
            });
        }

        function createRecommendationCard(rec, index) {
            const card = document.createElement('div');
            card.className = `recommendation-card ${rec.priority}`;

            const contentHtml = rec.suggestedContent && rec.suggestedContent.length > 0
                ? `
                    <div class="suggested-content">
                        <h4>추천 학습 콘텐츠</h4>
                        <ul class="content-list">
                            ${rec.suggestedContent.map(content => `<li>${content}</li>`).join('')}
                        </ul>
                    </div>
                `
                : '';

            card.innerHTML = `
                <div class="recommendation-header">
                    <div class="recommendation-icon">${rec.icon}</div>
                    <div class="recommendation-title">
                        <h2>${rec.title}</h2>
                        <span class="priority-badge ${rec.priority}">${getPriorityText(rec.priority)}</span>
                    </div>
                </div>
                <p class="recommendation-description">${rec.description}</p>
                ${contentHtml}
                <div class="confidence-bar">
                    <div class="confidence-fill" style="width: ${rec.confidence * 100}%"></div>
                </div>
                <p style="margin-top: 10px; color: #888; font-size: 0.9em;">
                    신뢰도: ${(rec.confidence * 100).toFixed(0)}%
                </p>
                <div class="action-buttons">
                    <button class="action-btn primary" onclick="acceptRecommendation(${index})">
                        시작하기
                    </button>
                    <button class="action-btn secondary" onclick="dismissRecommendation(${index})">
                        나중에
                    </button>
                </div>
            `;

            return card;
        }

        function displayInsights(insights) {
            if (!insights) return;

            document.getElementById('trendValue').textContent =
                insights.learningRate > 0 ? `+${insights.learningRate.toFixed(1)}%` : `${insights.learningRate.toFixed(1)}%`;

            document.getElementById('consistencyValue').textContent =
                (insights.consistency * 100).toFixed(0) + '%';

            const avgScore = currentRecommendations && currentRecommendations.length > 0
                ? recommendationEngine.learningPatterns.mean.toFixed(1)
                : '--';
            document.getElementById('averageScore').textContent = avgScore;

            const totalAct = recommendationEngine?.learningPatterns?.totalAttempts || '--';
            document.getElementById('totalActivities').textContent = totalAct;
        }

        function getPriorityText(priority) {
            const texts = {
                high: '높음',
                medium: '중간',
                low: '낮음'
            };
            return texts[priority] || priority;
        }

        function acceptRecommendation(index) {
            const rec = currentRecommendations[index];
            alert(`"${rec.title}" 학습을 시작합니다!\n\n${rec.description}`);
            // 실제 구현: 학습 콘텐츠 페이지로 이동
        }

        function dismissRecommendation(index) {
            const rec = currentRecommendations[index];
            console.log('Dismissed recommendation:', rec.title);
            // 실제 구현: 추천 숨기기/다음에 보기
        }

        function saveSettings() {
            const settings = {
                enableNotifications: document.getElementById('enableNotifications').checked,
                autoUpdate: document.getElementById('autoUpdate').checked,
                maxRecommendations: parseInt(document.getElementById('maxRecommendations').value)
            };

            localStorage.setItem('recommendationSettings', JSON.stringify(settings));
            alert('설정이 저장되었습니다!');
        }

        // Export for debugging
        window.recommendationEngine = recommendationEngine;
        window.loadRecommendations = loadRecommendations;
    </script>
</body>
</html>
