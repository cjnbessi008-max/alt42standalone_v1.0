<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Digest - Smartphone Display</title>
    <link rel="stylesheet" href="css/smartphone-style.css">
    <link rel="stylesheet" href="css/recommendation-style.css">
</head>
<body>
    <!-- Virtual Smartphone Display (bottom right) -->
    <div id="vector-digest-smartphone" class="smartphone-container">
        <!-- Phone Frame -->
        <div class="phone-frame">
            <!-- Notch (iPhone-style) -->
            <div class="phone-notch"></div>

            <!-- Screen -->
            <div class="phone-screen">
                <!-- Status Bar -->
                <div class="status-bar">
                    <span class="time">12:34</span>
                    <div class="status-icons">
                        <span class="signal">📶</span>
                        <span class="battery">🔋</span>
                    </div>
                </div>

                <!-- App Content -->
                <div class="app-content">
                    <!-- Header -->
                    <div class="app-header">
                        <div class="header-icon">📐</div>
                        <h2>학습 도우미</h2>
                        <button class="minimize-btn" id="minimizeBtn">−</button>
                    </div>

                    <!-- Tab Navigation -->
                    <div class="content-tabs">
                        <button class="content-tab active" id="digestTab">요약</button>
                        <button class="content-tab" id="recommendTab">추천</button>
                    </div>

                    <!-- Digest Panel -->
                    <div class="digest-content content-panel active" id="digestContent">
                        <div class="loading" id="loadingIndicator">
                            <div class="spinner"></div>
                            <p>분석 중...</p>
                        </div>

                        <div class="digest-card" id="digestCard" style="display: none;">
                            <div class="concept-badge" id="conceptBadge">Vector Basics</div>

                            <div class="digest-lines">
                                <div class="digest-line line-1" id="line1">
                                    <span class="line-number">1</span>
                                    <p class="line-text"></p>
                                </div>
                                <div class="digest-line line-2" id="line2">
                                    <span class="line-number">2</span>
                                    <p class="line-text"></p>
                                </div>
                                <div class="digest-line line-3" id="line3">
                                    <span class="line-number">3</span>
                                    <p class="line-text"></p>
                                </div>
                            </div>

                            <div class="digest-footer">
                                <div class="confidence" id="confidence">
                                    <span class="confidence-label">신뢰도:</span>
                                    <div class="confidence-bar">
                                        <div class="confidence-fill" id="confidenceFill"></div>
                                    </div>
                                    <span class="confidence-value" id="confidenceValue">0%</span>
                                </div>

                                <div class="action-buttons">
                                    <button class="btn-helpful" id="btnHelpful" title="도움됨">👍</button>
                                    <button class="btn-refresh" id="btnRefresh" title="새로고침">🔄</button>
                                    <button class="btn-expand" id="btnExpand" title="확장">⤢</button>
                                </div>
                            </div>
                        </div>

                        <div class="no-content" id="noContent" style="display: none;">
                            <div class="no-content-icon">📭</div>
                            <p>벡터 개념이 감지되지 않았습니다.</p>
                        </div>

                        <div class="error-message" id="errorMessage" style="display: none;">
                            <div class="error-icon">⚠️</div>
                            <p class="error-text">오류가 발생했습니다.</p>
                        </div>
                    </div>

                    <!-- Recommendation Panel -->
                    <div class="digest-content content-panel" id="recommendContent">
                        <!-- Learning Path Progress -->
                        <div class="learning-path-section" id="learningPathSection" style="display: none;"></div>

                        <!-- Profile Summary -->
                        <div class="profile-summary" id="profileSummary" style="display: none;"></div>

                        <!-- Recommendations Header -->
                        <div class="recommendation-section">
                            <div class="recommendation-header">
                                <div>
                                    <span class="icon">🎯</span>
                                    <h3 style="display: inline; margin-left: 8px;">맞춤 추천</h3>
                                </div>
                                <button class="refresh-recommendations-btn" id="refreshRecommendationsBtn">
                                    🔄
                                </button>
                            </div>

                            <!-- Recommendations List -->
                            <div class="recommendations-list" id="recommendationsList">
                                <div class="recommendations-loading">
                                    <div class="spinner"></div>
                                    <p>추천 생성 중...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Home Indicator (iPhone-style) -->
                <div class="home-indicator"></div>
            </div>
        </div>

        <!-- Minimized State -->
        <div class="minimized-button" id="minimizedBtn" style="display: none;">
            <span class="icon">📐</span>
            <span class="badge" id="notificationBadge">1</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/vector-digest.js"></script>
    <script src="js/recommendation-controller.js"></script>
    <script>
        // Initialize Vector Digest and Recommendation System
        document.addEventListener('DOMContentLoaded', function() {
            // Get question ID and user ID from page context or URL
            const questionId = getQuestionIdFromPage();
            const userId = getUserIdFromPage();

            // Initialize Vector Digest
            if (questionId) {
                window.vectorDigest = new VectorDigest({
                    apiUrl: '/vector-digest/api/VectorDigestAPI.php',
                    questionId: questionId,
                    autoLoad: true,
                    position: 'bottom-right'
                });
            }

            // Initialize Recommendation System
            if (userId) {
                window.recommendationController = new RecommendationController({
                    apiUrl: '/vector-digest/recommendation/RecommendationAPI.php',
                    userId: userId,
                    autoLoad: true
                });

                // Show profile and learning path sections
                const profileSection = document.getElementById('profileSummary');
                const pathSection = document.getElementById('learningPathSection');
                if (profileSection) profileSection.style.display = 'block';
                if (pathSection) pathSection.style.display = 'block';
            }

            // Tab switching functionality
            const digestTab = document.getElementById('digestTab');
            const recommendTab = document.getElementById('recommendTab');
            const digestContent = document.getElementById('digestContent');
            const recommendContent = document.getElementById('recommendContent');

            digestTab.addEventListener('click', function() {
                digestTab.classList.add('active');
                recommendTab.classList.remove('active');
                digestContent.classList.add('active');
                recommendContent.classList.remove('active');
            });

            recommendTab.addEventListener('click', function() {
                recommendTab.classList.add('active');
                digestTab.classList.remove('active');
                recommendContent.classList.add('active');
                digestContent.classList.remove('active');
            });
        });

        // Extract question ID from Moodle page
        function getQuestionIdFromPage() {
            // Try multiple methods to get question ID
            const urlParams = new URLSearchParams(window.location.search);
            let qid = urlParams.get('q') || urlParams.get('questionid');

            if (!qid) {
                // Try to find in page data attributes
                const questionElement = document.querySelector('[data-question-id]');
                if (questionElement) {
                    qid = questionElement.getAttribute('data-question-id');
                }
            }

            if (!qid) {
                // Try to extract from page context (Moodle specific)
                if (typeof M !== 'undefined' && M.cfg && M.cfg.question) {
                    qid = M.cfg.question.id;
                }
            }

            return qid;
        }

        // Extract user ID from Moodle page
        function getUserIdFromPage() {
            // Try to get from Moodle global config
            if (typeof M !== 'undefined' && M.cfg && M.cfg.userid) {
                return M.cfg.userid;
            }

            // Try URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            let uid = urlParams.get('userid') || urlParams.get('uid');

            if (uid) {
                return uid;
            }

            // Try data attributes
            const userElement = document.querySelector('[data-user-id]');
            if (userElement) {
                return userElement.getAttribute('data-user-id');
            }

            // Fallback: return null (will need to be set manually)
            return null;
        }
    </script>
</body>
</html>
