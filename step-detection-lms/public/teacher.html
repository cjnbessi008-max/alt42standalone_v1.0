<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교사 대시보드 - Step Detection LMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 교사 대시보드</h1>
            <p class="subtitle">학생 학습 패턴 분석 및 건너뛰기 탐지</p>
        </header>

        <!-- Overview Dashboard -->
        <div id="dashboardOverview" class="screen active">
            <h2>전체 현황</h2>

            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <h3 id="totalStudents">0</h3>
                    <p>전체 학생</p>
                </div>
                <div class="dashboard-card">
                    <h3 id="totalSolutions">0</h3>
                    <p>제출된 풀이</p>
                </div>
                <div class="dashboard-card">
                    <h3 id="detectionRate">0%</h3>
                    <p>건너뛰기 탐지율</p>
                </div>
                <div class="dashboard-card">
                    <h3 id="avgTrustScore">100</h3>
                    <p>평균 신뢰도</p>
                </div>
            </div>

            <h2>학생 목록</h2>
            <div class="student-table">
                <table>
                    <thead>
                        <tr>
                            <th>학생명</th>
                            <th>학년</th>
                            <th>제출 풀이</th>
                            <th>의심 풀이</th>
                            <th>신뢰도 점수</th>
                            <th>상태</th>
                            <th>상세</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Student Detail -->
        <div id="studentDetail" class="screen">
            <button id="backToDashboard" class="btn-back">← 대시보드로</button>

            <h2 id="studentName"></h2>

            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <h3 id="studentTotalSolutions">0</h3>
                    <p>총 풀이 수</p>
                </div>
                <div class="dashboard-card">
                    <h3 id="studentSuspicious">0</h3>
                    <p>의심 풀이</p>
                </div>
                <div class="dashboard-card">
                    <h3 id="studentTrustScore">100</h3>
                    <p>신뢰도 점수</p>
                </div>
                <div class="dashboard-card">
                    <h3 id="studentAvgScore">0</h3>
                    <p>평균 점수</p>
                </div>
            </div>

            <h3>탐지 유형별 분포</h3>
            <div id="detectionBreakdown" class="stats-grid"></div>

            <h3>최근 풀이 기록</h3>
            <div id="recentSolutions"></div>

            <h3>탐지 상세 내역</h3>
            <div id="detectionHistory"></div>
        </div>
    </div>

    <script src="js/teacher.js"></script>
</body>
</html>
