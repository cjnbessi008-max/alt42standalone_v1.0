<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exponential Burst - Standalone Demo</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .demo-header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .demo-header h1 {
            font-size: 48px;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .demo-header p {
            font-size: 18px;
            opacity: 0.9;
        }

        /* Import styles from the module */
        .smartphone-frame {
            width: 380px;
            height: 720px;
            background: linear-gradient(145deg, #2c3e50, #34495e);
            border-radius: 40px;
            padding: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        0 0 0 2px #1a1a1a,
                        inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .smartphone-frame::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 25px;
            background: #2c3e50;
            border-radius: 0 0 15px 15px;
            z-index: 10;
        }

        .smartphone-screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #1a1a2e, #0f0f1e);
            border-radius: 30px;
            overflow: hidden;
            position: relative;
        }

        .burst-app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        .question-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .question-text {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            min-height: 40px;
        }

        .answer-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .answer-input {
            flex: 1;
            padding: 15px;
            font-size: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-align: center;
        }

        .answer-input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .submit-button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .burst-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .feedback-area {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .feedback-area.show {
            opacity: 1;
        }

        .feedback-area.correct {
            background: rgba(40, 167, 69, 0.9);
            color: #fff;
        }

        .feedback-area.incorrect {
            background: rgba(220, 53, 69, 0.9);
            color: #fff;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        .stats {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 16px;
        }

        .stats span {
            margin: 0 15px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="demo-header">
        <h1>🎆 Exponential Burst</h1>
        <p>지수 함수 폭발 성장 시각화 데모</p>
    </div>

    <div class="smartphone-frame">
        <div class="smartphone-screen">
            <div class="burst-app">
                <div class="question-container">
                    <div id="question-text" class="question-text">Loading...</div>
                </div>

                <div class="answer-container">
                    <input type="number" id="answer-input" class="answer-input" placeholder="Your answer...">
                    <button id="submit-btn" class="submit-button">Submit</button>
                </div>

                <canvas id="burst-canvas" class="burst-canvas" width="350" height="690"></canvas>

                <div id="feedback-area" class="feedback-area"></div>
            </div>
        </div>
    </div>

    <div class="stats">
        <span>🎯 Score: <strong id="score">0</strong></span>
        <span>🔥 Bursts: <strong id="bursts">0</strong></span>
        <span>⭐ Level: <strong id="level">1</strong></span>
    </div>

    <script>
        // Demo app logic
        let currentQuestion = null;
        let score = 0;
        let totalBursts = 0;
        let level = 1;
        const canvas = document.getElementById('burst-canvas');
        const ctx = canvas.getContext('2d');
        const particles = [];

        function loadNewQuestion() {
            const base = Math.floor(Math.random() * 4) + 2;
            const exponent = Math.floor(Math.random() * Math.min(5, level + 2)) + 1;

            currentQuestion = {
                base: base,
                exponent: exponent,
                correctAnswer: Math.pow(base, exponent)
            };

            document.getElementById('question-text').innerHTML =
                `What is ${base}<sup>${exponent}</sup>?`;
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').focus();
        }

        function submitAnswer() {
            const answer = parseFloat(document.getElementById('answer-input').value);
            if (isNaN(answer)) {
                showFeedback('Please enter a valid number', false);
                return;
            }

            const isCorrect = Math.abs(answer - currentQuestion.correctAnswer) < 0.001;

            if (isCorrect) {
                score++;
                totalBursts++;
                if (score % 5 === 0) level++;

                updateStats();
                showFeedback('Correct! Watch the exponential burst!', true);
                createExponentialBurst(currentQuestion.base, currentQuestion.exponent);
                setTimeout(loadNewQuestion, 3000);
            } else {
                showFeedback(`Not quite! The answer is ${currentQuestion.correctAnswer}`, false);
                document.querySelector('.answer-container').classList.add('shake');
                setTimeout(() => {
                    document.querySelector('.answer-container').classList.remove('shake');
                }, 500);
            }
        }

        function showFeedback(message, isCorrect) {
            const feedback = document.getElementById('feedback-area');
            feedback.textContent = message;
            feedback.className = 'feedback-area show ' + (isCorrect ? 'correct' : 'incorrect');
            setTimeout(() => feedback.classList.remove('show'), 2500);
        }

        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('bursts').textContent = totalBursts;
            document.getElementById('level').textContent = level;
        }

        function createExponentialBurst(base, exponent) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const stages = exponent;
            const stageDelay = 200;

            for (let stage = 1; stage <= stages; stage++) {
                setTimeout(() => {
                    const particleCount = Math.pow(base, stage);
                    createBurstStage(centerX, centerY, particleCount);
                }, stage * stageDelay);
            }
        }

        function createBurstStage(x, y, count) {
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F'];

            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count;
                const speed = 2 + Math.random() * 3;

                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 3 + Math.random() * 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: 0.01 + Math.random() * 0.02
                });
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(26, 26, 46, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.alpha -= p.decay;

                if (p.alpha > 0) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;

                    if (p.radius > 4) {
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = p.color;
                    }

                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1;
                } else {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        document.getElementById('submit-btn').addEventListener('click', submitAnswer);
        document.getElementById('answer-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitAnswer();
        });

        loadNewQuestion();
        animate();
    </script>
</body>
</html>
