<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Network Map - 학습 개념 네트워크 시각화</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Vis.js Network -->
    <link href="https://unpkg.com/vis-network@9.1.2/dist/dist/vis-network.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-project-diagram"></i> Log Network Map
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="refreshBtn">
                            <i class="fas fa-sync-alt"></i> 새로고침
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="moodleSyncBtn">
                            <i class="fas fa-cloud-download-alt"></i> Moodle 연동
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid mt-3">
        <div class="row">
            <!-- Left Sidebar - Controls -->
            <div class="col-md-3">
                <div class="card mb-3">
                    <div class="card-header bg-dark text-white">
                        <h5><i class="fas fa-sliders-h"></i> 필터 및 설정</h5>
                    </div>
                    <div class="card-body">
                        <!-- Student Selection -->
                        <div class="mb-3">
                            <label for="studentSelect" class="form-label">학생 선택</label>
                            <select class="form-select" id="studentSelect">
                                <option value="">전체 학생</option>
                            </select>
                        </div>

                        <!-- Difficulty Filter -->
                        <div class="mb-3">
                            <label class="form-label">난이도 필터</label>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="beginner" id="filterBeginner" checked>
                                <label class="form-check-label" for="filterBeginner">
                                    초급 <span class="badge bg-primary">Beginner</span>
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="intermediate" id="filterIntermediate" checked>
                                <label class="form-check-label" for="filterIntermediate">
                                    중급 <span class="badge bg-warning">Intermediate</span>
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="advanced" id="filterAdvanced" checked>
                                <label class="form-check-label" for="filterAdvanced">
                                    고급 <span class="badge bg-danger">Advanced</span>
                                </label>
                            </div>
                        </div>

                        <!-- Layout Options -->
                        <div class="mb-3">
                            <label for="layoutSelect" class="form-label">레이아웃</label>
                            <select class="form-select" id="layoutSelect">
                                <option value="hierarchical">계층형 (Hierarchical)</option>
                                <option value="force">힘 기반 (Force-directed)</option>
                                <option value="circular">원형 (Circular)</option>
                            </select>
                        </div>

                        <!-- Show Learning Paths -->
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="showLearningPaths">
                            <label class="form-check-label" for="showLearningPaths">
                                학습 경로 표시
                            </label>
                        </div>

                        <button class="btn btn-primary w-100" id="applyFilters">
                            <i class="fas fa-filter"></i> 필터 적용
                        </button>
                    </div>
                </div>

                <!-- Statistics -->
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5><i class="fas fa-chart-bar"></i> 통계</h5>
                    </div>
                    <div class="card-body" id="statisticsPanel">
                        <p class="text-muted">데이터를 불러오는 중...</p>
                    </div>
                </div>
            </div>

            <!-- Main Network Visualization -->
            <div class="col-md-9">
                <div class="card">
                    <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-network-wired"></i> 학습 개념 네트워크 맵</h5>
                        <div>
                            <button class="btn btn-sm btn-light" id="fitNetworkBtn">
                                <i class="fas fa-expand"></i> 맞춤
                            </button>
                            <button class="btn btn-sm btn-light" id="exportBtn">
                                <i class="fas fa-download"></i> 내보내기
                            </button>
                        </div>
                    </div>
                    <div class="card-body p-0 position-relative">
                        <!-- Network Canvas -->
                        <div id="networkContainer"></div>

                        <!-- Loading Overlay -->
                        <div id="loadingOverlay" class="loading-overlay">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2">네트워크 데이터를 불러오는 중...</p>
                        </div>
                    </div>
                </div>

                <!-- Concept Details Panel -->
                <div class="card mt-3" id="conceptDetailsCard" style="display: none;">
                    <div class="card-header bg-secondary text-white">
                        <h5><i class="fas fa-info-circle"></i> 개념 상세정보</h5>
                    </div>
                    <div class="card-body" id="conceptDetails">
                        <!-- Dynamic content -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Preview (Bottom Right) -->
    <div id="mobilePreview" class="mobile-preview">
        <div class="mobile-preview-header">
            <span><i class="fas fa-mobile-alt"></i> 모바일 미리보기</span>
            <button class="btn-close-preview" id="closeMobilePreview">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="mobile-preview-body">
            <iframe id="mobilePreviewFrame" src="mobile-preview.html"></iframe>
        </div>
    </div>

    <!-- Toggle Mobile Preview Button -->
    <button class="btn btn-primary mobile-preview-toggle" id="toggleMobilePreview">
        <i class="fas fa-mobile-alt"></i>
    </button>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Vis.js Network -->
    <script src="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.js"></script>

    <!-- Custom JS -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/network.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
