<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="기울기·경사 느낌을 애니메이션으로 학습하는 인터랙티브 웹앱">
    <meta name="theme-color" content="#667eea">
    <title>🎢 Slope Sense - 기울기 감각 학습</title>

    <!-- PWA Support -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/images/icon-192.png">

    <style>
        /* CSS Variables for theming */
        :root {
            --primary-color: #667eea;
            --primary-dark: #764ba2;
            --secondary-color: #4ecdc4;
            --success-color: #51cf66;
            --warning-color: #ffd43b;
            --error-color: #ff6b6b;
            --text-color: #2c3e50;
            --text-light: #7f8c8d;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.15);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            :root {
                --text-color: #ecf0f1;
                --text-light: #bdc3c7;
                --bg-color: #1a1a2e;
                --card-bg: #16213e;
                --border-color: #0f3460;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Smartphone Container - Bottom Right */
        .smartphone-wrapper {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 380px;
            height: 800px;
            z-index: 1000;
            filter: drop-shadow(var(--shadow-lg));
            transition: var(--transition);
        }

        .smartphone-frame {
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            border-radius: 40px;
            padding: 12px;
            position: relative;
        }

        .smartphone-screen {
            width: 100%;
            height: 100%;
            background: var(--card-bg);
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Notch */
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 28px;
            background: #1a1a1a;
            border-radius: 0 0 20px 20px;
            z-index: 10;
        }

        .notch-camera {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: #333;
            border-radius: 50%;
        }

        /* App Header */
        .app-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 40px 20px 24px;
            text-align: center;
            position: relative;
        }

        .app-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .app-subtitle {
            font-size: 13px;
            opacity: 0.9;
            font-weight: 500;
        }

        /* Content Area */
        .app-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            background: var(--bg-color);
            padding: 16px;
        }

        /* Scrollbar styling */
        .app-content::-webkit-scrollbar {
            width: 6px;
        }

        .app-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .app-content::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: var(--radius-md);
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-light);
            font-weight: 500;
        }

        /* Problem Card */
        .problem-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-md);
        }

        .problem-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .problem-number {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .level-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .level-1 { background: #d3f9d8; color: #2b8a3e; }
        .level-2 { background: #d0ebff; color: #1864ab; }
        .level-3 { background: #fff3bf; color: #e67700; }
        .level-4 { background: #ffe0e9; color: #c92a2a; }
        .level-5 { background: #f3d9fa; color: #862e9c; }

        .problem-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .problem-description {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-light);
            margin-bottom: 16px;
        }

        /* Canvas Container */
        .canvas-container {
            width: 100%;
            height: 320px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }

        #slopeCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Input Section */
        .input-section {
            margin-bottom: 16px;
        }

        .input-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .input-wrapper {
            position: relative;
        }

        .answer-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--card-bg);
            color: var(--text-color);
            transition: var(--transition);
        }

        .answer-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* Buttons */
        .btn-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn {
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: var(--bg-color);
            color: var(--text-color);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .btn-hint {
            background: var(--warning-color);
            color: #862e00;
        }

        .btn-hint:hover {
            background: #fcc419;
        }

        .btn-next {
            width: 100%;
            background: var(--success-color);
            color: white;
            margin-top: 8px;
        }

        .btn-next:hover {
            background: #40c057;
        }

        /* Hint Box */
        .hint-box {
            background: #fff9db;
            border-left: 4px solid var(--warning-color);
            padding: 14px;
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
            font-size: 14px;
            color: #862e00;
            display: none;
            animation: slideDown 0.3s ease;
        }

        .hint-box.show {
            display: block;
        }

        /* Feedback */
        .feedback {
            padding: 14px;
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            display: none;
            animation: slideDown 0.3s ease;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #d3f9d8;
            color: #2b8a3e;
            border: 2px solid var(--success-color);
        }

        .feedback.incorrect {
            background: #ffe0e9;
            color: #c92a2a;
            border: 2px solid var(--error-color);
        }

        .feedback-explanation {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 400;
            opacity: 0.9;
        }

        /* Controls Card */
        .controls-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }

        .controls-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-color);
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .control-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-light);
            min-width: 60px;
        }

        .control-slider {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--border-color);
            border-radius: 3px;
            outline: none;
        }

        .control-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
        }

        .control-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-color);
            min-width: 50px;
            text-align: right;
        }

        .animation-select {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
        }

        /* Progress Footer */
        .progress-footer {
            background: var(--card-bg);
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-light);
            font-weight: 500;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--primary-dark));
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* Animations */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .pulse {
            animation: pulse 0.5s ease;
        }

        /* Loading State */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 400px;
            gap: 16px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .smartphone-wrapper {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                height: 100%;
                border-radius: 0;
            }

            .smartphone-frame {
                border-radius: 0;
                padding: 0;
            }

            .smartphone-screen {
                border-radius: 0;
            }
        }

        /* Hidden utility */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Virtual Smartphone -->
    <div class="smartphone-wrapper">
        <div class="smartphone-frame">
            <div class="smartphone-screen">
                <!-- Notch -->
                <div class="notch">
                    <div class="notch-camera"></div>
                </div>

                <!-- Header -->
                <div class="app-header">
                    <div class="app-title">
                        <span>🎢</span>
                        <span>Slope Sense</span>
                    </div>
                    <div class="app-subtitle">기울기·경사 느낌 학습</div>
                </div>

                <!-- Content -->
                <div class="app-content" id="appContent">
                    <div class="loading" id="loadingState">
                        <div class="spinner"></div>
                        <div>문제를 불러오는 중...</div>
                    </div>

                    <!-- Stats will be injected here -->
                    <div id="statsContainer" class="hidden"></div>

                    <!-- Problem will be injected here -->
                    <div id="problemContainer" class="hidden"></div>

                    <!-- Controls will be injected here -->
                    <div id="controlsContainer" class="hidden"></div>
                </div>

                <!-- Progress Footer -->
                <div class="progress-footer">
                    <div class="progress-info">
                        <span>학습 진행도</span>
                        <span id="progressText">0 / 15</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" id="progressBarFill" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Core Modules -->
    <script type="module" src="js/modules/DataManager.js"></script>
    <script type="module" src="js/modules/AnimationEngine.js"></script>
    <script type="module" src="js/modules/UIManager.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
