<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="색감이 섞이며 확장되는 합집합 - AI 기반 적응형 학습">
    <meta name="theme-color" content="#667eea">
    <title>Color Union - 집합론 학습 앱</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32x32.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">

    <!-- Styles -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <!-- Landing Page -->
    <div class="landing-page" id="landingPage">
        <div class="hero-section">
            <div class="hero-content">
                <div class="logo-container">
                    <div class="logo-circle circle-1"></div>
                    <div class="logo-circle circle-2"></div>
                    <div class="logo-union"></div>
                </div>

                <h1 class="hero-title">Color Union</h1>
                <p class="hero-subtitle">색감이 섞이며 확장되는 합집합</p>
                <p class="hero-description">
                    AI가 당신의 학습 패턴을 분석하여<br>
                    맞춤형 문제를 추천합니다
                </p>

                <div class="hero-features">
                    <div class="feature-item">
                        <span class="feature-icon">🎨</span>
                        <span class="feature-text">시각적 학습</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🤖</span>
                        <span class="feature-text">AI 추천</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">📊</span>
                        <span class="feature-text">진행 분석</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">📱</span>
                        <span class="feature-text">오프라인 지원</span>
                    </div>
                </div>

                <div class="cta-buttons">
                    <button class="btn btn-primary btn-large" id="btnGetStarted">
                        시작하기
                    </button>
                    <button class="btn btn-secondary btn-large" id="btnLogin">
                        로그인
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <button class="modal-close" id="closeLoginModal">&times;</button>

            <h2 class="modal-title">로그인</h2>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginUsername">사용자명</label>
                    <input
                        type="text"
                        id="loginUsername"
                        name="username"
                        required
                        autocomplete="username"
                        placeholder="사용자명을 입력하세요"
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">비밀번호</label>
                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        required
                        autocomplete="current-password"
                        placeholder="비밀번호를 입력하세요"
                    >
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>로그인 상태 유지</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    로그인
                </button>

                <div class="form-footer">
                    <p>계정이 없으신가요?
                        <a href="#" id="showRegisterModal">회원가입</a>
                    </p>
                </div>
            </form>
        </div>
    </div>

    <!-- Register Modal -->
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <button class="modal-close" id="closeRegisterModal">&times;</button>

            <h2 class="modal-title">회원가입</h2>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="registerUsername">사용자명</label>
                    <input
                        type="text"
                        id="registerUsername"
                        name="username"
                        required
                        autocomplete="username"
                        placeholder="사용자명 (3-20자)"
                        minlength="3"
                        maxlength="20"
                    >
                </div>

                <div class="form-group">
                    <label for="registerEmail">이메일</label>
                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        required
                        autocomplete="email"
                        placeholder="email@example.com"
                    >
                </div>

                <div class="form-group">
                    <label for="registerPassword">비밀번호</label>
                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        required
                        autocomplete="new-password"
                        placeholder="비밀번호 (최소 6자)"
                        minlength="6"
                    >
                    <small class="form-hint">최소 6자 이상 입력하세요</small>
                </div>

                <div class="form-group">
                    <label for="registerPasswordConfirm">비밀번호 확인</label>
                    <input
                        type="password"
                        id="registerPasswordConfirm"
                        name="passwordConfirm"
                        required
                        autocomplete="new-password"
                        placeholder="비밀번호 다시 입력"
                    >
                </div>

                <div class="form-group">
                    <label for="registerGrade">학년</label>
                    <select id="registerGrade" name="grade" required>
                        <option value="">선택하세요</option>
                        <option value="elementary-1">초등학교 1학년</option>
                        <option value="elementary-2">초등학교 2학년</option>
                        <option value="elementary-3">초등학교 3학년</option>
                        <option value="elementary-4">초등학교 4학년</option>
                        <option value="elementary-5">초등학교 5학년</option>
                        <option value="elementary-6">초등학교 6학년</option>
                        <option value="middle-1">중학교 1학년</option>
                        <option value="middle-2">중학교 2학년</option>
                        <option value="middle-3">중학교 3학년</option>
                        <option value="high-1">고등학교 1학년</option>
                        <option value="high-2">고등학교 2학년</option>
                        <option value="high-3">고등학교 3학년</option>
                        <option value="adult">성인</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    회원가입
                </button>

                <div class="form-footer">
                    <p>이미 계정이 있으신가요?
                        <a href="#" id="showLoginModal">로그인</a>
                    </p>
                </div>
            </form>
        </div>
    </div>

    <!-- PWA Install Prompt -->
    <div class="install-prompt" id="installPrompt" style="display: none;">
        <div class="install-content">
            <p>📱 Color Union을 홈 화면에 추가하시겠습니까?</p>
            <div class="install-buttons">
                <button class="btn btn-primary btn-small" id="btnInstall">설치</button>
                <button class="btn btn-secondary btn-small" id="btnDismiss">나중에</button>
            </div>
        </div>
    </div>

    <!-- Notification Container -->
    <div class="notification-container" id="notificationContainer"></div>

    <!-- Scripts -->
    <script src="js/modules/storage.js"></script>
    <script src="js/modules/auth.js"></script>
    <script src="js/modules/notification.js"></script>
    <script src="js/app.js"></script>

    <script>
        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('SW registered:', registration);
                    })
                    .catch(error => {
                        console.log('SW registration failed:', error);
                    });
            });
        }

        // PWA Install Prompt
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;

            // Show install prompt after 30 seconds
            setTimeout(() => {
                document.getElementById('installPrompt').style.display = 'block';
            }, 30000);
        });

        document.getElementById('btnInstall')?.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response: ${outcome}`);
                deferredPrompt = null;
                document.getElementById('installPrompt').style.display = 'none';
            }
        });

        document.getElementById('btnDismiss')?.addEventListener('click', () => {
            document.getElementById('installPrompt').style.display = 'none';
        });
    </script>
</body>
</html>
