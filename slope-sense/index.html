<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slope Sense - 기울기 감각 학습</title>
    <link rel="stylesheet" href="assets/css/smartphone.css">
</head>
<body>
    <!-- Virtual Smartphone Container (Bottom Right) -->
    <div class="smartphone-container">
        <div class="smartphone-frame">
            <!-- Notch -->
            <div class="smartphone-notch">
                <div class="notch-camera"></div>
            </div>

            <!-- App Header -->
            <div class="app-header">
                <h1>🎢 Slope Sense</h1>
                <div class="subtitle">기울기·경사 느낌 학습</div>
            </div>

            <!-- Main Content -->
            <div class="app-content">
                <div class="content-wrapper">
                    <!-- Stats -->
                    <div class="stats">
                        <div class="stat-item">
                            <div class="stat-value" id="correctCount">0</div>
                            <div class="stat-label">정답</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="totalCount">0</div>
                            <div class="stat-label">시도</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="accuracyRate">0%</div>
                            <div class="stat-label">정답률</div>
                        </div>
                    </div>

                    <!-- Problem Card -->
                    <div class="problem-card">
                        <div class="problem-header">
                            <span class="problem-number" id="problemNumber">문제 #1</span>
                            <span class="difficulty-badge difficulty-1" id="difficultyBadge">난이도 1</span>
                        </div>

                        <div class="problem-text" id="problemText">
                            두 점 (0,0)과 (4,2) 사이의 기울기를 구하세요.
                        </div>

                        <!-- Canvas for Animation -->
                        <div class="canvas-container">
                            <canvas id="slopeCanvas"></canvas>
                        </div>

                        <!-- Controls -->
                        <div class="controls">
                            <div class="input-group">
                                <label for="answerInput">기울기:</label>
                                <input type="number" id="answerInput" step="0.01" placeholder="답을 입력하세요">
                            </div>

                            <div class="button-group">
                                <button class="btn btn-primary" id="submitBtn">제출</button>
                                <button class="btn btn-secondary" id="resetBtn">다시보기</button>
                                <button class="btn btn-hint" id="hintBtn">힌트</button>
                            </div>

                            <!-- Hint Box -->
                            <div class="hint-box" id="hintBox">
                                💡 기울기 = (y₂ - y₁) / (x₂ - x₁)
                            </div>

                            <!-- Feedback -->
                            <div class="feedback" id="feedback"></div>
                        </div>
                    </div>

                    <!-- Animation Controls -->
                    <div class="problem-card">
                        <div class="problem-header">
                            <span class="problem-number">애니메이션 컨트롤</span>
                        </div>

                        <div class="input-group">
                            <label for="speedControl">속도:</label>
                            <input type="range" id="speedControl" min="0.5" max="3" step="0.1" value="1">
                            <span id="speedValue">1.0x</span>
                        </div>

                        <div class="button-group">
                            <button class="btn btn-secondary" id="playBtn">▶ 재생</button>
                            <button class="btn btn-secondary" id="pauseBtn">⏸ 일시정지</button>
                        </div>

                        <div class="input-group" style="margin-top: 10px;">
                            <label for="animationType">유형:</label>
                            <select id="animationType" style="flex: 1; padding: 10px; border-radius: 8px; border: 2px solid #e0e0e0;">
                                <option value="ball_roll">🎱 공 굴리기</option>
                                <option value="skier">⛷️ 스키어</option>
                                <option value="car_drive">🚗 자동차</option>
                                <option value="water_flow">💧 물 흐름</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
                <div class="progress-label">
                    <span>학습 진행도</span>
                    <span id="progressText">0 / 5</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/slope-animation.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
