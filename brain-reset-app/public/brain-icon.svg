<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Brain outline -->
  <path d="M50 10 C 30 10, 15 25, 15 45 C 15 55, 18 63, 23 68 C 20 72, 18 77, 18 82 C 18 90, 24 95, 32 95 C 35 95, 38 94, 40 92 C 43 94, 46 95, 50 95 C 54 95, 57 94, 60 92 C 62 94, 65 95, 68 95 C 76 95, 82 90, 82 82 C 82 77, 80 72, 77 68 C 82 63, 85 55, 85 45 C 85 25, 70 10, 50 10 Z"
        fill="url(#brainGradient)"
        opacity="0.9"/>

  <!-- Brain details -->
  <circle cx="35" cy="40" r="3" fill="white" opacity="0.8"/>
  <circle cx="65" cy="40" r="3" fill="white" opacity="0.8"/>

  <!-- Smile -->
  <path d="M 35 55 Q 50 65, 65 55"
        stroke="white"
        stroke-width="3"
        fill="none"
        stroke-linecap="round"
        opacity="0.8"/>

  <!-- Sparkle effect -->
  <circle cx="25" cy="25" r="2" fill="white" opacity="0.9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="30" r="2" fill="white" opacity="0.9">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
