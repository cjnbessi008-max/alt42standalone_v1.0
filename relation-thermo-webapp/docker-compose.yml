version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:5.7
    container_name: relation-thermo-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: relation_thermo
      MYSQL_USER: rtuser
      MYSQL_PASSWORD: rtpassword
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - relation-thermo-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 20s
      retries: 10

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: relation-thermo-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mysql://rtuser:rtpassword@mysql:3306/relation_thermo
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      FRONTEND_URL: http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - relation-thermo-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: relation-thermo-frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - relation-thermo-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  relation-thermo-network:
    driver: bridge

volumes:
  mysql_data:
