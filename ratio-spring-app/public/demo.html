<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratio Spring - 데모</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .demo-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .demo-section {
            margin-bottom: 30px;
        }

        .demo-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .ratio-examples {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .ratio-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .ratio-card:hover {
            background: #e9ecef;
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .ratio-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .ratio-description {
            font-size: 14px;
            color: #666;
        }

        .custom-input {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }

        .custom-input input {
            width: 80px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
        }

        .custom-input input:focus {
            outline: none;
            border-color: #667eea;
        }

        .separator {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(102, 126, 234, 0.4);
        }

        .features {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }

        .features ul {
            list-style: none;
            padding: 0;
        }

        .features li {
            padding: 10px 0;
            padding-left: 30px;
            position: relative;
        }

        .features li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #51cf66;
            font-weight: bold;
            font-size: 20px;
        }

        .links {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .link-btn {
            flex: 1;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s;
        }

        .link-btn:hover {
            background: #f0f2ff;
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <h1>🎨 Ratio Spring</h1>
        <p class="subtitle">비율을 스프링 애니메이션으로 배우는 웹앱</p>

        <div class="demo-section">
            <h2>📚 예제 비율</h2>
            <div class="ratio-examples">
                <div class="ratio-card" onclick="loadRatio(1, 1)">
                    <div class="ratio-value">1:1</div>
                    <div class="ratio-description">똑같이</div>
                </div>
                <div class="ratio-card" onclick="loadRatio(2, 3)">
                    <div class="ratio-value">2:3</div>
                    <div class="ratio-description">피자 나누기</div>
                </div>
                <div class="ratio-card" onclick="loadRatio(3, 4)">
                    <div class="ratio-value">3:4</div>
                    <div class="ratio-description">음료 섞기</div>
                </div>
                <div class="ratio-card" onclick="loadRatio(5, 2)">
                    <div class="ratio-value">5:2</div>
                    <div class="ratio-description">학생 비율</div>
                </div>
            </div>
        </div>

        <div class="demo-section">
            <h2>🎯 사용자 정의 비율</h2>
            <div class="custom-input">
                <input type="number" id="customA" value="2" min="1" max="10">
                <span class="separator">:</span>
                <input type="number" id="customB" value="3" min="1" max="10">
                <button class="btn" onclick="loadCustomRatio()">적용</button>
            </div>
        </div>

        <div class="demo-section">
            <h2>✨ 주요 기능</h2>
            <div class="features">
                <ul>
                    <li>📱 우측 하단 가상 스마트폰 화면</li>
                    <li>🎨 스프링 물리 시뮬레이션 애니메이션</li>
                    <li>🔗 Moodle LMS 연동 지원</li>
                    <li>💾 MySQL 데이터베이스 저장</li>
                    <li>🎓 교육용 인터랙티브 시각화</li>
                    <li>📊 학생 진도 추적</li>
                </ul>
            </div>
        </div>

        <div class="demo-section">
            <div class="links">
                <a href="index.html" class="link-btn">메인 앱 열기</a>
                <a href="../docs/API.md" class="link-btn">API 문서</a>
                <a href="../docs/INSTALLATION.md" class="link-btn">설치 가이드</a>
            </div>
        </div>
    </div>

    <script>
        function loadRatio(a, b) {
            window.location.href = `index.html?ratio_a=${a}&ratio_b=${b}`;
        }

        function loadCustomRatio() {
            const a = document.getElementById('customA').value;
            const b = document.getElementById('customB').value;

            if (a < 1 || a > 10 || b < 1 || b > 10) {
                alert('1과 10 사이의 값을 입력하세요!');
                return;
            }

            loadRatio(a, b);
        }

        // 엔터키로 적용
        document.getElementById('customA').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') loadCustomRatio();
        });
        document.getElementById('customB').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') loadCustomRatio();
        });
    </script>
</body>
</html>
