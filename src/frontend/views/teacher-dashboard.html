<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교사 대시보드 - 불안정한 개념 감지 시스템</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>🎓 불안정한 개념 감지 시스템</h1>
            <p>정답을 맞췄더라도 불안정하게 이해한 개념을 자동으로 감지합니다</p>
        </div>
    </div>

    <div class="container">
        <!-- Statistics Overview -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <h3>전체 학생 수</h3>
                <div class="value" id="totalStudents">-</div>
            </div>
            <div class="stat-card">
                <h3>추적 중인 개념</h3>
                <div class="value" id="totalConcepts">-</div>
            </div>
            <div class="stat-card warning">
                <h3>주의 필요 학생</h3>
                <div class="value" id="studentsNeedingAttention">-</div>
            </div>
            <div class="stat-card danger">
                <h3>불안정한 개념 발견</h3>
                <div class="value" id="unstableInstances">-</div>
            </div>
        </div>

        <!-- Recent Alerts -->
        <div class="card">
            <div class="card-header">
                <h2>⚠️ 최근 경고</h2>
                <button class="btn btn-secondary" onclick="refreshData()">새로고침</button>
            </div>
            <div id="alertsContainer">
                <div class="loading">데이터 로딩 중</div>
            </div>
        </div>

        <!-- Students Overview -->
        <div class="card">
            <div class="card-header">
                <h2>👥 학생 현황</h2>
            </div>
            <div id="studentsContainer">
                <div class="loading">데이터 로딩 중</div>
            </div>
        </div>

        <!-- Concepts Needing Attention -->
        <div class="card">
            <div class="card-header">
                <h2>📚 주의가 필요한 개념</h2>
            </div>
            <div id="conceptsContainer">
                <div class="loading">데이터 로딩 중</div>
            </div>
        </div>
    </div>

    <script src="../js/dashboard.js"></script>
</body>
</html>
