<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explosion Count - 경우의 수 학습 앱</title>
    <link rel="stylesheet" href="css/smartphone.css">
    <link rel="stylesheet" href="css/explosion.css">
</head>
<body>
    <!-- 메인 컨테이너 -->
    <div class="main-container">
        <!-- 왼쪽: 문제 선택 및 정보 -->
        <div class="control-panel">
            <h1>Explosion Count</h1>
            <p class="subtitle">경우의 수 증가를 시각화하는 학습 도구</p>

            <div class="problem-selector">
                <h2>문제 선택</h2>
                <div id="problem-list" class="problem-cards">
                    <!-- JavaScript로 동적 생성 -->
                </div>
            </div>

            <div class="info-panel">
                <h3 id="problem-title">문제를 선택하세요</h3>
                <p id="problem-description"></p>

                <div class="stats">
                    <div class="stat-item">
                        <label>현재 경우의 수:</label>
                        <span id="current-count-display" class="count-number">0</span>
                    </div>
                    <div class="stat-item">
                        <label>최대 경우의 수:</label>
                        <span id="max-count-display" class="count-number">0</span>
                    </div>
                    <div class="stat-item">
                        <label>현재 단계:</label>
                        <span id="current-step-display" class="count-number">0</span>
                    </div>
                </div>

                <div class="controls">
                    <button id="start-btn" class="btn btn-primary" disabled>시작</button>
                    <button id="next-btn" class="btn btn-secondary" disabled>다음 단계</button>
                    <button id="reset-btn" class="btn btn-tertiary" disabled>초기화</button>
                </div>

                <div class="steps-info" id="steps-info">
                    <h4>단계별 증가</h4>
                    <div id="steps-list" class="steps-container">
                        <!-- JavaScript로 동적 생성 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 오른쪽 하단: 가상 스마트폰 -->
        <div class="smartphone-container">
            <div class="smartphone">
                <!-- 스마트폰 프레임 -->
                <div class="smartphone-frame">
                    <!-- 노치 (notch) -->
                    <div class="smartphone-notch"></div>

                    <!-- 화면 -->
                    <div class="smartphone-screen">
                        <div class="app-header">
                            <h2>Explosion Count</h2>
                            <div class="app-status">
                                <span id="app-status-text">대기중</span>
                            </div>
                        </div>

                        <div class="app-content">
                            <!-- 카운터 표시 -->
                            <div class="counter-display">
                                <div class="counter-label">경우의 수</div>
                                <div id="explosion-count" class="counter-value">1</div>
                            </div>

                            <!-- 불꽃 애니메이션 캔버스 -->
                            <canvas id="explosion-canvas" width="300" height="400"></canvas>

                            <!-- 진행 상황 -->
                            <div class="progress-container">
                                <div class="progress-label">
                                    <span id="step-name">시작 전</span>
                                    <span id="step-multiplier"></span>
                                </div>
                                <div class="progress-bar">
                                    <div id="progress-fill" class="progress-fill"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 홈 버튼 -->
                    <div class="smartphone-button"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/moodleAPI.js"></script>
    <script src="js/animation.js"></script>
    <script src="js/explosionCount.js"></script>
</body>
</html>
