<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Touch Math - Tangent Learning</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="smartphone-frame">
        <div class="app-container">
            <!-- Header -->
            <header class="app-header">
                <h1>접선 학습</h1>
                <div class="problem-info" id="problemInfo">
                    <span id="problemTitle">문제를 불러오는 중...</span>
                </div>
            </header>

            <!-- Main Canvas Area -->
            <main class="canvas-container">
                <canvas id="graphCanvas"></canvas>

                <!-- Shine Effect Layer -->
                <canvas id="shineCanvas"></canvas>
            </main>

            <!-- Control Panel -->
            <div class="control-panel">
                <div class="instruction" id="instruction">
                    곡선 위의 점을 선택하여 접선을 그려보세요
                </div>

                <div class="button-group">
                    <button id="resetBtn" class="btn btn-secondary">다시 그리기</button>
                    <button id="submitBtn" class="btn btn-primary">제출</button>
                </div>

                <div class="feedback" id="feedback"></div>
            </div>

            <!-- Loading Overlay -->
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
                <p>연결 중...</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/tangent.js"></script>
    <script src="js/shine-effect.js"></script>
    <script src="js/moodle-api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
