version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: inequality_arrow_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: inequality_arrow_db
      MYSQL_USER: inequality_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-secure_password_here}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - inequality_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # PHP-FPM with Apache
  web:
    image: php:8.0-apache
    container_name: inequality_arrow_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=inequality_arrow_db
      - DB_USER=inequality_user
      - DB_PASS=${DB_PASSWORD:-secure_password_here}
      - MOODLE_URL=${MOODLE_URL:-https://your-moodle-site.com}
      - MOODLE_TOKEN=${MOODLE_TOKEN:-your_moodle_token}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www/html/backend
      - ./frontend:/var/www/html/frontend
      - ./docker/apache-config.conf:/etc/apache2/sites-available/000-default.conf
    networks:
      - inequality_network
    command: >
      bash -c "
        docker-php-ext-install pdo pdo_mysql mysqli &&
        a2enmod rewrite &&
        apache2-foreground
      "

  # PHPMyAdmin (Optional - for database management)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: inequality_arrow_phpmyadmin
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: inequality_user
      PMA_PASSWORD: ${DB_PASSWORD:-secure_password_here}
    ports:
      - "8080:80"
    networks:
      - inequality_network

volumes:
  db_data:
    driver: local

networks:
  inequality_network:
    driver: bridge
