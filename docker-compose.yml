version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:5.7
    container_name: balance-machine-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-balance_secret}
      MYSQL_DATABASE: ${DB_NAME:-balance_machine}
      MYSQL_USER: ${DB_USER:-balance_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-balance_secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - balance-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: balance-machine-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-balance_user}
      DB_PASSWORD: ${DB_PASSWORD:-balance_secret}
      DB_NAME: ${DB_NAME:-balance_machine}
      CORS_ORIGIN: http://localhost:5173
      MOODLE_API_URL: ${MOODLE_API_URL:-}
      MOODLE_TOKEN: ${MOODLE_TOKEN:-}
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - balance-network
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules

  # Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: balance-machine-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - balance-network
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules

networks:
  balance-network:
    driver: bridge

volumes:
  mysql_data:
