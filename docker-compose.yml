version: '3.8'

services:
  # PostgreSQL 데이터베이스
  postgres:
    image: postgres:15-alpine
    container_name: routine_cards_db
    environment:
      POSTGRES_USER: routine_user
      POSTGRES_PASSWORD: routine_pass
      POSTGRES_DB: routine_cards
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routine_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI 백엔드
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: routine_cards_backend
    environment:
      DATABASE_URL: postgresql://routine_user:routine_pass@postgres:5432/routine_cards
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      DEBUG: ${DEBUG:-false}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      ENABLE_AUTO_GENERATION: ${ENABLE_AUTO_GENERATION:-true}
      CARD_GENERATION_TIME: ${CARD_GENERATION_TIME:-07:00:00}
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # React 프론트엔드 (개발)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: routine_cards_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  backend_logs:
