# Docker Compose Configuration for AI Education System
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ai-edu-postgres
    environment:
      POSTGRES_USER: ai_edu_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password_change_in_production}
      POSTGRES_DB: ai_education
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - ai-edu-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_edu_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ai-edu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-edu-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python FastAPI Pipeline Orchestrator
  pipeline:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: ai-edu-pipeline
    environment:
      DATABASE_URL: postgresql://ai_edu_user:${DB_PASSWORD:-dev_password_change_in_production}@postgres:5432/ai_education
      REDIS_URL: redis://redis:6379
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    volumes:
      - ./pipeline:/app
      - pipeline_logs:/app/logs
    networks:
      - ai-edu-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Node.js API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: ai-edu-api-gateway
    environment:
      DATABASE_URL: postgresql://ai_edu_user:${DB_PASSWORD:-dev_password_change_in_production}@postgres:5432/ai_education
      REDIS_URL: redis://redis:6379
      PIPELINE_URL: http://pipeline:8000
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_production}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "3001:3001"
    volumes:
      - ./api-gateway:/app
      - /app/node_modules
    networks:
      - ai-edu-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pipeline:
        condition: service_started
    command: npm run dev

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-edu-frontend
    environment:
      REACT_APP_API_URL: http://localhost:3001
      REACT_APP_WS_URL: ws://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ai-edu-network
    depends_on:
      - api-gateway
    command: npm start

networks:
  ai-edu-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pipeline_logs:
