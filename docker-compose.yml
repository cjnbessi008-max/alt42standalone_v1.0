version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: relaxation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: relaxation_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - relaxation-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: relaxation-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/relaxation_db?schema=public
      # Moodle DB configuration (update these with your actual values)
      MOODLE_DB_HOST: ${MOODLE_DB_HOST:-host.docker.internal}
      MOODLE_DB_PORT: ${MOODLE_DB_PORT:-3306}
      MOODLE_DB_USER: ${MOODLE_DB_USER:-relaxation_ro}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:-password}
      MOODLE_DB_NAME: ${MOODLE_DB_NAME:-moodle}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - relaxation-network
    volumes:
      - ./backend/logs:/app/logs

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: relaxation-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - relaxation-network
    environment:
      REACT_APP_API_URL: http://localhost:4000/api/v1

  # Nginx (optional - for production)
  # nginx:
  #   image: nginx:alpine
  #   container_name: relaxation-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - frontend
  #     - backend
  #   networks:
  #     - relaxation-network

networks:
  relaxation-network:
    driver: bridge

volumes:
  postgres_data:
