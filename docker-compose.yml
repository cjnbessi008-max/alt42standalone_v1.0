version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: emotion-detection-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emotion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emotion_password}
      POSTGRES_DB: ${POSTGRES_DB:-emotion_detection}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emotion_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: emotion-detection-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emotion-detection-backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-emotion_user}:${POSTGRES_PASSWORD:-emotion_password}@postgres:5432/${POSTGRES_DB:-emotion_detection}
      - REDIS_URL=redis://redis:6379/0
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - USE_AI_ANALYSIS=${USE_AI_ANALYSIS:-false}
      - LMS_TYPE=${LMS_TYPE:-custom}
      - LMS_URL=${LMS_URL:-}
      - LMS_API_KEY=${LMS_API_KEY:-}
      - LMS_WEBHOOK_URL=${LMS_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emotion-detection-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 3000

volumes:
  postgres_data:
  redis_data:
