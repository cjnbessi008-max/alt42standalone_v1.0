version: '3.8'

services:
  mysql:
    image: mysql:5.7
    container_name: moodle-correlation-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-moodle_correlation}
      MYSQL_USER: ${MYSQL_USER:-moodle_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-moodlepass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: moodle-correlation-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-moodle_user}:${MYSQL_PASSWORD:-moodlepass}@mysql:3306/${MYSQL_DATABASE:-moodle_correlation}
      MOODLE_BASE_URL: ${MOODLE_BASE_URL}
      MOODLE_API_TOKEN: ${MOODLE_API_TOKEN}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-jwt-secret-key-change-in-production}
      DEBUG: ${DEBUG:-False}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - backend_logs:/app/logs

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: moodle-correlation-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_logs:
