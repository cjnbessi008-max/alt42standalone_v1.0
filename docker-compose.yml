version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: color_partition_db
    environment:
      POSTGRES_DB: education_system
      POSTGRES_USER: eduuser
      POSTGRES_PASSWORD: edupassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schemas:/docker-entrypoint-initdb.d
    networks:
      - edu_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduuser -d education_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: color_partition_cache
    ports:
      - "6379:6379"
    networks:
      - edu_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: color_partition_backend
    environment:
      DATABASE_URL: postgresql://eduuser:edupassword123@postgres:5432/education_system
      REDIS_URL: redis://redis:6379
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edu_network
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: color_partition_frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - edu_network
    command: npm run dev -- --host

volumes:
  postgres_data:

networks:
  edu_network:
    driver: bridge
