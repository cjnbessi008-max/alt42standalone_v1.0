version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms-checkpoint-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/database/lms_checkpoint.db
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - ./database:/app/database
      - ./backend/logs:/app/logs
    restart: unless-stopped
    networks:
      - lms-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lms-checkpoint-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:3001/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - lms-network

networks:
  lms-network:
    driver: bridge

volumes:
  database-data:
