version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dmn-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dmn_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-dmn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - dmn-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dmn_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: dmn-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - dmn-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DMN Analysis Service (Python FastAPI)
  dmn-service:
    build:
      context: ./backend/dmn-service
      dockerfile: Dockerfile
    container_name: dmn-service
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-dmn_monitoring}
      - POSTGRES_USER=${POSTGRES_USER:-dmn_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DMN_SERVICE_PORT=${DMN_SERVICE_PORT:-8000}
    ports:
      - "${DMN_SERVICE_PORT:-8000}:8000"
    volumes:
      - ./backend/dmn-service:/app
    networks:
      - dmn-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # API Gateway (Node.js)
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: dmn-api-gateway
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - API_GATEWAY_PORT=${API_GATEWAY_PORT:-3000}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-dmn_monitoring}
      - POSTGRES_USER=${POSTGRES_USER:-dmn_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DMN_SERVICE_HOST=dmn-service
      - DMN_SERVICE_PORT=8000
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-this}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - MOODLE_URL=${MOODLE_URL:-http://localhost}
      - MOODLE_API_TOKEN=${MOODLE_API_TOKEN:-}
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    volumes:
      - ./backend/api-gateway:/app
      - /app/node_modules
    networks:
      - dmn-network
    depends_on:
      - postgres
      - redis
      - dmn-service
    restart: unless-stopped

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dmn-frontend
    environment:
      - VITE_API_URL=http://localhost:3000
      - VITE_WS_URL=http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - dmn-network
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  dmn-network:
    driver: bridge
