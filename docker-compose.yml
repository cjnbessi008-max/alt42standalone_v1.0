version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:5.7
    container_name: blend_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: blend_difference_db
      MYSQL_USER: blenduser
      MYSQL_PASSWORD: blendpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - blend_network

  # PHP Backend
  php:
    image: php:7.1.9-apache
    container_name: blend_php
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8080:80"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: blend_difference_db
      DB_USER: blenduser
      DB_PASS: blendpass
      MOODLE_URL: ${MOODLE_URL:-http://localhost/moodle}
      MOODLE_TOKEN: ${MOODLE_TOKEN:-}
    depends_on:
      - mysql
    networks:
      - blend_network
    command: >
      bash -c "
      docker-php-ext-install pdo pdo_mysql mysqli &&
      a2enmod rewrite &&
      apache2-foreground
      "

  # Frontend (Node.js for development)
  frontend:
    image: node:18-alpine
    container_name: blend_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_LMS_ENDPOINT: http://localhost:8080/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - blend_network

volumes:
  mysql_data:

networks:
  blend_network:
    driver: bridge
