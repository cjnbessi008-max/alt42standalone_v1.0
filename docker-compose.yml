version: '3.8'

services:
  # 백엔드 API 서버
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: warmup-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LMS_TYPE=${LMS_TYPE:-}
      - LMS_BASE_URL=${LMS_BASE_URL:-}
      - LMS_API_TOKEN=${LMS_API_TOKEN:-}
    volumes:
      - ./backend:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - warmup-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 프론트엔드 웹앱
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: warmup-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - warmup-network
    stdin_open: true
    tty: true

networks:
  warmup-network:
    driver: bridge
