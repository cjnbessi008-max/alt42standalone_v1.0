version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:5.7
    container_name: composition_puzzle_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: composition_puzzle
      MYSQL_USER: puzzle_user
      MYSQL_PASSWORD: puzzle_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - puzzle_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: composition_puzzle_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: puzzle_user
      DB_PASSWORD: puzzle_password
      DB_NAME: composition_puzzle
      LTI_KEY: composition_puzzle_key
      LTI_SECRET: change_this_secret_in_production
      SESSION_SECRET: change_this_session_secret_in_production
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - puzzle_network

  # Frontend (Development)
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: composition_puzzle_frontend_dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - puzzle_network

  # Frontend (Production)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: composition_puzzle_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - puzzle_network
    profiles:
      - production

  # nginx (Reverse Proxy for Production)
  nginx:
    image: nginx:alpine
    container_name: composition_puzzle_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - puzzle_network
    profiles:
      - production

volumes:
  mysql_data:
    driver: local

networks:
  puzzle_network:
    driver: bridge
