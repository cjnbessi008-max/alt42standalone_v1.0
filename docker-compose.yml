version: '3.8'

services:
  # PostgreSQL 데이터베이스
  postgres:
    image: postgres:15-alpine
    container_name: logheat-db
    environment:
      POSTGRES_DB: logheat_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: logheat_secure_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - logheat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 백엔드 API 서버
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logheat-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: logheat_db
      DB_USER: postgres
      DB_PASSWORD: logheat_secure_password
      CORS_ORIGIN: http://localhost:3000
      # Moodle 설정 (환경에 맞게 수정 필요)
      MOODLE_URL: ${MOODLE_URL:-https://your-moodle-site.com}
      MOODLE_TOKEN: ${MOODLE_TOKEN:-your_token_here}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - logheat-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 프론트엔드 (개발 모드)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: logheat-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_UPDATE_INTERVAL: 60000
      REACT_APP_DEFAULT_TIME_WINDOW: 1h
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - logheat-network
    restart: unless-stopped

networks:
  logheat-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
