version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: lms_postgres
    environment:
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_password
      POSTGRES_DB: lms_education
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_user -d lms_education"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: lms_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python AI Pipeline (FastAPI)
  pipeline:
    build:
      context: ./pipeline
      dockerfile: ../docker/Dockerfile.pipeline
    container_name: lms_pipeline
    environment:
      - DATABASE_URL=postgresql://lms_user:lms_password@postgres:5432/lms_education
      - REDIS_URL=redis://redis:6379
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    volumes:
      - ./pipeline:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  # Node.js API Gateway (Express)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: ../docker/Dockerfile.api-gateway
    container_name: lms_api_gateway
    environment:
      - DATABASE_URL=postgresql://lms_user:lms_password@postgres:5432/lms_education
      - REDIS_URL=redis://redis:6379
      - PIPELINE_SERVICE_URL=http://pipeline:8000
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key}
      - PORT=3000
      - NODE_ENV=development
    ports:
      - "3000:3000"
    volumes:
      - ./api-gateway:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pipeline:
        condition: service_started
    command: npm run dev

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: lms_frontend
    environment:
      - REACT_APP_API_URL=http://localhost:3000/api
      - REACT_APP_WS_URL=ws://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api-gateway
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
