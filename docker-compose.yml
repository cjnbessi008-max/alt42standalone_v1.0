version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: timeline_db
    environment:
      POSTGRES_USER: timeline_user
      POSTGRES_PASSWORD: timeline_pass
      POSTGRES_DB: timeline_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timeline_user -d timeline_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timeline_backend
    environment:
      DATABASE_URL: postgresql://timeline_user:timeline_pass@db:5432/timeline_db
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend (development mode)
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: timeline_frontend_dev
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  # React Frontend (production mode)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: timeline_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    profiles:
      - production

volumes:
  postgres_data:
