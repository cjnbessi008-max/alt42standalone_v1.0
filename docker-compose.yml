version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:5.7
    container_name: partialsum_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle_user
      MYSQL_PASSWORD: moodle_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/database/schemas:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - partialsum_network

  # PHP Backend
  php-backend:
    image: php:7.1.9-apache
    container_name: partialsum_php
    depends_on:
      - mysql
    ports:
      - "8080:80"
    volumes:
      - ./src/backend:/var/www/html
    environment:
      DB_HOST: mysql
      DB_NAME: moodle
      DB_USER: moodle_user
      DB_PASS: moodle_pass
      MOODLE_PREFIX: mdl_
    networks:
      - partialsum_network
    command: >
      bash -c "docker-php-ext-install pdo pdo_mysql mysqli
      && apache2-foreground"

  # Frontend Development Server
  frontend:
    image: node:18-alpine
    container_name: partialsum_frontend
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080/api
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - partialsum_network

volumes:
  mysql_data:
    driver: local

networks:
  partialsum_network:
    driver: bridge
