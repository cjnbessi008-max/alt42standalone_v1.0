version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: reasoning-db
    environment:
      POSTGRES_USER: reasoning_user
      POSTGRES_PASSWORD: reasoning_pass
      POSTGRES_DB: reasoning_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reasoning_user -d reasoning_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reasoning-network

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reasoning-backend
    environment:
      DATABASE_URL: postgresql://reasoning_user:reasoning_pass@database:5432/reasoning_db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://frontend:3000
      DEBUG: ${DEBUG:-false}
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - reasoning-network
    restart: unless-stopped

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reasoning-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - reasoning-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  reasoning-network:
    driver: bridge
