<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute Mirror - 절댓값 방정식 미러 터널</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Main Control Panel -->
        <div class="control-panel">
            <h1>Absolute Mirror</h1>
            <div class="problem-info">
                <h2 id="problemTitle">절댓값 방정식 문제</h2>
                <p id="problemDescription">문제를 불러오는 중...</p>
            </div>

            <div class="equation-display">
                <div id="equationText">|x - 3| = 5</div>
            </div>

            <div class="controls">
                <button id="loadProblem" class="btn btn-primary">새 문제 불러오기</button>
                <button id="showSolution" class="btn btn-secondary">해설 보기</button>
                <button id="resetView" class="btn btn-secondary">뷰 초기화</button>
            </div>

            <div class="interaction-controls">
                <label for="xValue">x 값 조절:</label>
                <input type="range" id="xValue" min="-10" max="10" value="0" step="0.1">
                <span id="xValueDisplay">0</span>

                <label for="animationSpeed">애니메이션 속도:</label>
                <input type="range" id="animationSpeed" min="1" max="10" value="5" step="1">
                <span id="speedDisplay">5</span>
            </div>

            <div class="solution-panel" id="solutionPanel" style="display: none;">
                <h3>해설</h3>
                <div id="solutionContent"></div>
            </div>
        </div>

        <!-- Virtual Smartphone Display (Bottom Right) -->
        <div class="smartphone-container">
            <div class="smartphone-frame">
                <div class="smartphone-notch"></div>
                <div class="smartphone-screen">
                    <canvas id="mirrorCanvas"></canvas>
                    <div class="visualization-info">
                        <div id="leftValue" class="value-display">좌측 값: <span>0</span></div>
                        <div id="rightValue" class="value-display">우측 값: <span>0</span></div>
                        <div id="mirrorAxis" class="value-display">대칭축: <span>x = 3</span></div>
                    </div>
                </div>
                <div class="smartphone-home-button"></div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p>문제를 불러오는 중...</p>
    </div>

    <script src="js/config.js"></script>
    <script src="js/moodleAPI.js"></script>
    <script src="js/mirrorTunnel.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
