<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derivative Flip Cards - 미분 규칙 학습</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <!-- Main Container -->
    <div class="main-container">
        <h1>Derivative Flip Cards</h1>
        <p class="subtitle">미분 규칙을 카드 뒤집기로 학습하세요</p>

        <!-- Student Info Display -->
        <div id="student-info" class="student-info">
            <span id="student-name"></span>
            <span id="progress-info"></span>
        </div>
    </div>

    <!-- Smartphone Screen (Bottom Right) -->
    <div class="smartphone-container">
        <div class="smartphone">
            <!-- Smartphone Screen -->
            <div class="smartphone-screen">
                <!-- App Header -->
                <div class="app-header">
                    <h2>미분 규칙</h2>
                    <div class="card-counter">
                        <span id="current-card">1</span> / <span id="total-cards">0</span>
                    </div>
                </div>

                <!-- Card Container -->
                <div class="card-area">
                    <div id="flip-card" class="flip-card">
                        <div class="flip-card-inner">
                            <!-- Front Side - Question -->
                            <div class="flip-card-front">
                                <div class="card-content">
                                    <h3>규칙 이름</h3>
                                    <div id="rule-name" class="rule-name"></div>
                                    <p class="hint">탭하여 공식 보기</p>
                                </div>
                            </div>

                            <!-- Back Side - Answer -->
                            <div class="flip-card-back">
                                <div class="card-content">
                                    <h3>미분 공식</h3>
                                    <div id="formula" class="formula"></div>
                                    <div id="example" class="example"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Navigation Controls -->
                <div class="controls">
                    <button id="prev-btn" class="nav-btn" onclick="previousCard()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                        이전
                    </button>

                    <button id="flip-btn" class="flip-btn" onclick="flipCard()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 4v6h6M23 20v-6h-6"></path>
                            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
                        </svg>
                        뒤집기
                    </button>

                    <button id="next-btn" class="nav-btn" onclick="nextCard()">
                        다음
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>

                <!-- Recommendation Controls -->
                <div class="recommendation-controls">
                    <button id="recommend-btn" class="recommend-btn" onclick="showRecommendedCard()" title="AI가 추천하는 다음 카드를 보여줍니다">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                        추천 카드
                    </button>

                    <button id="path-btn" class="path-btn" onclick="showLearningPath()" title="개인화된 학습 경로를 보여줍니다">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 3v18h18"></path>
                            <path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"></path>
                        </svg>
                        학습 경로
                    </button>

                    <button id="smart-next-btn" class="smart-next-btn" onclick="getSmartNext()" title="AI 추천 기반 다음 카드">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="13 17 18 12 13 7"></polyline>
                            <polyline points="6 17 11 12 6 7"></polyline>
                        </svg>
                        스마트 다음
                    </button>
                </div>

                <!-- Progress Bar -->
                <div class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>

                <!-- Status Message -->
                <div id="status-message" class="status-message"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
</body>
</html>
