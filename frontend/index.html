<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deviation Breeze - 학습 편차 시각화</title>

    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/smartphone.css">
    <link rel="stylesheet" href="assets/css/breeze-viz.css">
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-wind"></i> Deviation Breeze
            </span>
            <div class="navbar-text text-white">
                <span id="moodle-status" class="badge badge-secondary">
                    <i class="fas fa-circle"></i> Moodle 연결 확인 중...
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Left Sidebar -->
            <div class="col-md-3 bg-light sidebar">
                <div class="sidebar-sticky pt-3">
                    <h5 class="sidebar-heading">
                        <i class="fas fa-book"></i> 퀴즈 선택
                    </h5>
                    <div class="form-group">
                        <label for="courseSelect">코스</label>
                        <select class="form-control" id="courseSelect">
                            <option value="">코스를 선택하세요...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="quizSelect">퀴즈</label>
                        <select class="form-control" id="quizSelect" disabled>
                            <option value="">먼저 코스를 선택하세요...</option>
                        </select>
                    </div>
                    <button id="loadQuizBtn" class="btn btn-primary btn-block" disabled>
                        <i class="fas fa-chart-bar"></i> 편차 분석 보기
                    </button>

                    <hr class="my-4">

                    <h5 class="sidebar-heading">
                        <i class="fas fa-cog"></i> 설정
                    </h5>
                    <div class="custom-control custom-switch">
                        <input type="checkbox" class="custom-control-input" id="autoRefresh" checked>
                        <label class="custom-control-label" for="autoRefresh">
                            자동 새로고침
                        </label>
                    </div>
                    <div class="custom-control custom-switch mt-2">
                        <input type="checkbox" class="custom-control-input" id="showSmartphone" checked>
                        <label class="custom-control-label" for="showSmartphone">
                            스마트폰 표시
                        </label>
                    </div>

                    <hr class="my-4">

                    <div class="stats-card">
                        <h6><i class="fas fa-info-circle"></i> 통계</h6>
                        <div id="statsContainer">
                            <p class="text-muted mb-0">퀴즈를 선택하세요</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 main-content">
                <!-- Deviation Visualization Area -->
                <div class="card mt-3">
                    <div class="card-header bg-info text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-wind"></i> 편차 시각화 - Deviation Breeze
                        </h4>
                    </div>
                    <div class="card-body p-0">
                        <div id="breezeVisualization" class="breeze-container">
                            <div class="breeze-placeholder">
                                <i class="fas fa-chart-area fa-3x text-muted"></i>
                                <p class="text-muted mt-3">퀴즈를 선택하여 편차 분석을 시작하세요</p>
                            </div>
                            <svg id="breezeSvg" width="100%" height="500"></svg>
                        </div>
                    </div>
                </div>

                <!-- Student List -->
                <div class="card mt-3">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-users"></i> 학생 목록 및 상세 정보
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover" id="studentTable">
                                <thead class="thead-dark">
                                    <tr>
                                        <th>순위</th>
                                        <th>이름</th>
                                        <th>점수</th>
                                        <th>백분위</th>
                                        <th>편차 (Z-score)</th>
                                        <th>그룹</th>
                                        <th>상세</th>
                                    </tr>
                                </thead>
                                <tbody id="studentTableBody">
                                    <tr>
                                        <td colspan="7" class="text-center text-muted">
                                            데이터가 없습니다
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Virtual Smartphone (우측 하단 고정) -->
    <div id="smartphoneContainer" class="smartphone-container">
        <div class="smartphone-device">
            <!-- Phone Header -->
            <div class="smartphone-header">
                <div class="smartphone-statusbar">
                    <span class="time">12:30</span>
                    <div class="icons">
                        <i class="fas fa-signal"></i>
                        <i class="fas fa-wifi"></i>
                        <i class="fas fa-battery-full"></i>
                    </div>
                </div>
            </div>

            <!-- Phone Screen -->
            <div class="smartphone-screen" id="smartphoneScreen">
                <div class="smartphone-content">
                    <div class="text-center py-5">
                        <i class="fas fa-mobile-alt fa-3x text-secondary mb-3"></i>
                        <h5>Deviation Breeze</h5>
                        <p class="text-muted">문제를 선택하면 여기에 표시됩니다</p>
                    </div>
                </div>
            </div>

            <!-- Phone Home Button -->
            <div class="smartphone-button"></div>
        </div>

        <!-- Drag Handle -->
        <div class="smartphone-drag-handle">
            <i class="fas fa-grip-vertical"></i>
        </div>

        <!-- Toggle Button -->
        <button class="smartphone-toggle" id="smartphoneToggle">
            <i class="fas fa-chevron-down"></i>
        </button>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="loading-spinner" style="display: none;">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
        <p class="mt-2">데이터를 불러오는 중...</p>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>

    <!-- Custom Scripts -->
    <script src="assets/js/api-client.js"></script>
    <script src="assets/js/smartphone-simulator.js"></script>
    <script src="assets/js/breeze-visualizer.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
