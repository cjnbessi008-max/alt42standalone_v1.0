<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Term Vision - 다음 항 예측하기</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- 메인 컨테이너 -->
    <div class="container">
        <!-- 좌측: 정보 패널 -->
        <div class="info-panel">
            <h1>Next Term Vision</h1>
            <p class="subtitle">수열의 다음 항을 예측해보세요!</p>

            <!-- 학생 정보 -->
            <div class="student-info">
                <h3>학생 정보</h3>
                <div class="info-group">
                    <label for="studentId">학생 ID:</label>
                    <input type="number" id="studentId" value="1" min="1">
                </div>
            </div>

            <!-- 진행 상황 -->
            <div class="progress-section">
                <h3>진행 상황</h3>
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">현재 레벨:</span>
                        <span class="stat-value" id="currentLevel">1</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">정답률:</span>
                        <span class="stat-value" id="accuracy">0%</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">총 문제:</span>
                        <span class="stat-value" id="totalProblems">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">맞춘 개수:</span>
                        <span class="stat-value" id="correctAnswers">0</span>
                    </div>
                </div>
            </div>

            <!-- 컨트롤 버튼 -->
            <div class="controls">
                <button id="newProblemBtn" class="btn btn-primary">새 문제</button>
                <div class="difficulty-selector">
                    <label>난이도:</label>
                    <select id="difficultySelect">
                        <option value="">자동</option>
                        <option value="1">레벨 1 (쉬움)</option>
                        <option value="2">레벨 2</option>
                        <option value="3">레벨 3 (보통)</option>
                        <option value="4">레벨 4</option>
                        <option value="5">레벨 5 (어려움)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 우측: 스마트폰 시뮬레이터 -->
        <div class="smartphone-container">
            <div class="smartphone">
                <!-- 스마트폰 상단 노치 -->
                <div class="phone-notch"></div>

                <!-- 스마트폰 화면 -->
                <div class="phone-screen">
                    <!-- 앱 헤더 -->
                    <div class="app-header">
                        <div class="time">10:30</div>
                        <div class="title">다음 항 예측하기</div>
                        <div class="battery">
                            <span class="battery-icon">🔋</span>
                        </div>
                    </div>

                    <!-- 문제 영역 -->
                    <div class="problem-area">
                        <div id="loadingIndicator" class="loading">
                            <div class="spinner"></div>
                            <p>문제를 불러오는 중...</p>
                        </div>

                        <div id="problemContent" class="problem-content" style="display: none;">
                            <!-- 문제 유형 표시 -->
                            <div class="problem-type">
                                <span id="problemTypeLabel">산술 수열</span>
                            </div>

                            <!-- 수열 표시 영역 -->
                            <div id="sequenceDisplay" class="sequence-display"></div>

                            <!-- 힌트 버튼 -->
                            <div class="hint-section">
                                <button id="hintBtn" class="btn-hint">💡 힌트 보기</button>
                                <div id="hintText" class="hint-text" style="display: none;"></div>
                            </div>

                            <!-- 입력 영역 -->
                            <div class="answer-section">
                                <label for="answerInput">다음 항은?</label>
                                <div class="input-group">
                                    <input type="number" id="answerInput" placeholder="답을 입력하세요">
                                    <button id="submitBtn" class="btn btn-submit">제출</button>
                                </div>
                            </div>

                            <!-- 피드백 영역 -->
                            <div id="feedbackArea" class="feedback-area" style="display: none;"></div>
                        </div>
                    </div>

                    <!-- 앱 하단 네비게이션 -->
                    <div class="app-footer">
                        <div class="nav-item active">
                            <span class="nav-icon">🏠</span>
                            <span class="nav-label">홈</span>
                        </div>
                        <div class="nav-item">
                            <span class="nav-icon">📊</span>
                            <span class="nav-label">통계</span>
                        </div>
                        <div class="nav-item">
                            <span class="nav-icon">⚙️</span>
                            <span class="nav-label">설정</span>
                        </div>
                    </div>
                </div>

                <!-- 스마트폰 홈 버튼 -->
                <div class="phone-home-button"></div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/smartphone-simulator.js"></script>
    <script src="js/next-term-animation.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
